<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swing HRIS Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: fixed sidebar + scrolling workspace; Swing deck language (gradient hero, lavender highlight cards, letter-spaced eyebrows) */
:root {
  --bg: #F7F4FE;
  --surface: #FFFFFF;
  --surface-2: #F5EFFF;
  --line: #ECE6F7;
  --line-strong: #D9C8FA;
  --ink: #16122C;
  --muted: #5F5A74;
  --faint: #8D88A2;
  --accent: #6A1DE4;
  --accent-ink: #FFFFFF;
  --magenta: #D615CF;
  --grad: linear-gradient(118deg, #5A14E0 0%, #9A12DC 55%, #E013D0 100%);
  --ok: #0F7A57; --ok-bg: #E3F5EC;
  --warn: #8E5300; --warn-bg: #FFF1D9;
  --bad: #BB2439; --bad-bg: #FDE8EB;
  --shadow: 0 1px 2px rgba(45, 20, 100, .05), 0 10px 28px rgba(70, 25, 150, .07);
  --overlay: rgba(22, 18, 44, .45);
  --font-display: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Karla", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 16px;
  --radius-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0B1C; --surface: #17132A; --surface-2: #211839; --line: #2A2345; --line-strong: #4B3A80;
    --ink: #F2EFFB; --muted: #B4AECB; --faint: #807A9A; --accent: #B78EFF; --accent-ink: #16122C; --magenta: #F270E8;
    --ok: #55D6A5; --ok-bg: #11302A; --warn: #F3B85E; --warn-bg: #33270F; --bad: #FF8494; --bad-bg: #3A1821;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --overlay: rgba(5, 3, 14, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0B1C; --surface: #17132A; --surface-2: #211839; --line: #2A2345; --line-strong: #4B3A80;
  --ink: #F2EFFB; --muted: #B4AECB; --faint: #807A9A; --accent: #B78EFF; --accent-ink: #16122C; --magenta: #F270E8;
  --ok: #55D6A5; --ok-bg: #11302A; --warn: #F3B85E; --warn-bg: #33270F; --bad: #FF8494; --bad-bg: #3A1821;
  --shadow: 0 1px 2px rgba(0,0,0,.3); --overlay: rgba(5, 3, 14, .7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: .92em; }

.eyebrow { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 11.5px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.eyebrow::before { content: ""; width: 22px; height: 2px; background: currentColor; border-radius: 2px; }
.label { font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* Logo */
.logo { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.03em; color: var(--accent); }
.logo svg { width: 24px; height: 24px; }
.logo.on-grad { color: #fff; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 999px; padding: 9px 18px; font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 1.2; background: var(--surface); color: var(--ink); border-color: var(--line-strong); transition: transform .12s ease, box-shadow .12s ease, background .12s ease; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 6px 16px rgba(120, 20, 220, .25); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); border-color: var(--bad-bg); background: var(--bad-bg); }
.btn.ok { color: var(--ok); border-color: var(--ok-bg); background: var(--ok-bg); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 10px; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* Forms */
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-weight: 600; font-size: 13.5px; }
.field small { color: var(--faint); font-size: 12.5px; }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius-sm); padding: 10px 12px; min-height: 42px; }
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.form-grid .full { grid-column: 1 / -1; }
.form-grid.hol-grid { grid-template-columns: minmax(0, 180px) minmax(0, 1fr) auto; align-items: end; }
[hidden] { display: none !important; }
.error-text { color: var(--bad); font-size: 13.5px; font-weight: 600; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; min-width: 0; }
.card.hl { background: var(--surface-2); border-color: var(--line-strong); box-shadow: none; }
.card.grad { background: var(--grad); color: #fff; border: 0; }
.card.grad .label, .card.grad .muted { color: rgba(255,255,255,.85); }
.card h3 { font-size: 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.stack { display: grid; gap: 18px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.split { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.pending { color: var(--warn); background: var(--warn-bg); }
.pill.approved, .pill.active { color: var(--ok); background: var(--ok-bg); }
.pill.rejected, .pill.inactive { color: var(--bad); background: var(--bad-bg); }
.pill.cancelled { color: var(--faint); background: var(--surface-2); }
.tag { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 6px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--accent); border: 1px solid var(--line-strong); white-space: nowrap; }

/* Tables */
.table-wrap { overflow-x: auto; margin-inline: -4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-family: var(--font-display); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 700; padding: 10px 12px; border-bottom: 1.5px solid var(--line-strong); white-space: nowrap; }
td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.actions { white-space: nowrap; text-align: right; }

/* Login */
.login { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.login-hero { background: var(--grad); color: #fff; padding: 48px clamp(24px, 5vw, 72px); display: flex; flex-direction: column; justify-content: space-between; gap: 40px; }
.login-hero .eyebrow { color: rgba(255,255,255,.9); }
.login-hero h1 { font-size: clamp(36px, 5vw, 60px); line-height: 1.02; font-weight: 800; margin-block: 18px 16px; }
.login-hero p { font-size: 17px; max-width: 44ch; color: rgba(255,255,255,.9); }
.hero-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.hero-cards div { border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.1); border-radius: 14px; padding: 14px; font-size: 13.5px; }
.hero-cards strong { display: block; font-family: var(--font-display); font-size: 16px; margin-top: 4px; }
.login-panel { display: grid; place-items: center; padding: 40px 24px; }
.login-box { width: min(420px, 100%); display: grid; gap: 22px; }
.login-box h2 { font-size: 30px; }
.demo-list { display: grid; gap: 8px; }
.demo { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; }
.demo:hover { border-color: var(--line-strong); background: var(--surface-2); }
.demo b { font-family: var(--font-display); display: block; }
.pw-wrap { position: relative; }
.pw-wrap .input { padding-right: 70px; }
.pw-wrap button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }

/* Shell */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; position: sticky; top: 0; height: 100vh; }
.side-brand { display: grid; gap: 6px; padding-inline: 8px; }
.side-brand small { font-family: var(--font-display); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
.nav { display: grid; gap: 4px; }
.nav button { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 0; background: transparent; text-align: left; padding: 10px 12px; border-radius: 10px; font-weight: 600; color: var(--muted); }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button.on { background: var(--surface-2); color: var(--accent); box-shadow: inset 0 0 0 1px var(--line-strong); }
.nav .count { min-width: 22px; padding: 1px 7px; border-radius: 999px; background: var(--grad); color: #fff; font-size: 12px; font-weight: 700; text-align: center; }
.side-foot { margin-top: auto; display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.me { display: flex; gap: 10px; align-items: center; padding-inline: 4px; min-width: 0; }
.me div { min-width: 0; }
.me b { display: block; font-family: var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--grad); color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 13px; }
.avatar.lg { width: 44px; height: 44px; font-size: 15px; }
.main { padding: 32px clamp(16px, 4vw, 44px) 64px; display: grid; gap: 24px; align-content: start; min-width: 0; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: clamp(28px, 3.4vw, 40px); font-weight: 800; margin-top: 8px; }
.page-head p { color: var(--muted); margin-top: 6px; max-width: 64ch; }

/* Balance tiles */
.balance .big { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1; margin-top: 12px; }
.balance .of { color: var(--muted); font-size: 14px; margin-top: 6px; }
.meter { height: 8px; border-radius: 999px; background: var(--surface-2); margin-top: 16px; overflow: hidden; display: flex; border: 1px solid var(--line); }
.meter i { display: block; height: 100%; }
.meter .used { background: var(--grad); }
.meter .pend { background: repeating-linear-gradient(45deg, var(--line-strong) 0 4px, transparent 4px 8px); }
.balance .meta { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
.stat .big { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; margin-top: 10px; }

/* Lists */
.list { display: grid; }
.list-item { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.list-item:last-child { border-bottom: 0; padding-bottom: 0; }
.list-item:first-child { padding-top: 0; }
.list-item .grow { flex: 1; min-width: 0; }
.list-item b { font-family: var(--font-display); }
.date-chip { flex: none; width: 52px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface-2); text-align: center; padding: 6px 0; line-height: 1.1; }
.date-chip b { display: block; font-size: 20px; color: var(--accent); }
.date-chip small { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.empty { color: var(--faint); padding: 18px 0; text-align: center; }

/* Approvals */
.approval { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: start; }
.approval .who { display: flex; gap: 12px; align-items: center; }
.approval .facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 14px; font-size: 14px; }
.approval .facts div { display: grid; }
.approval .facts small { color: var(--faint); font-size: 12px; font-weight: 600; }
.approval blockquote { margin: 14px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--surface-2); color: var(--ink); font-size: 14px; }
.approval .btns { display: grid; gap: 8px; }

/* Notes and banners */
.note { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line-strong); font-size: 14px; }
.note.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.note.bad { background: var(--bad-bg); border-color: transparent; color: var(--bad); }
.note b { font-family: var(--font-display); }

/* Summary panel */
.summary { position: sticky; top: 24px; }
.summary dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; margin: 16px 0 0; font-size: 14px; }
.summary dt { color: rgba(255,255,255,.8); }
.summary dd { margin: 0; text-align: right; font-weight: 700; }
.summary .days { font-family: var(--font-display); font-size: 56px; font-weight: 800; line-height: 1; margin-top: 10px; }
.skipped { margin-top: 14px; display: grid; gap: 6px; font-size: 13px; }
.skipped span { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,.14); }

/* Calendar */
.cal-wrap { overflow-x: auto; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(110px, 1fr)); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 770px; }
.cal .dow { background: var(--surface-2); padding: 8px 10px; font-family: var(--font-display); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.cal .day { min-height: 108px; padding: 8px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); display: grid; gap: 4px; align-content: start; background: var(--surface); }
.cal .day:nth-child(7n+1) { border-left: 0; }
.cal .day.out { background: var(--bg); }
.cal .day.out .d { color: var(--faint); }
.cal .day.weekend { background: color-mix(in srgb, var(--surface-2) 55%, var(--surface)); }
.cal .day.today .d { background: var(--grad); color: #fff; border-radius: 999px; padding: 0 7px; justify-self: start; }
.cal .d { font-family: var(--font-display); font-weight: 700; font-size: 14px; }
.cal .hol { font-size: 11.5px; font-weight: 700; color: var(--magenta); line-height: 1.25; }
.cal .who { font-size: 12px; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal .who.pend { background: transparent; border-style: dashed; color: var(--muted); }
.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 10px; border-radius: 3px; display: inline-block; border: 1px solid var(--line-strong); background: var(--surface-2); }
.legend i.pend { border-style: dashed; background: transparent; }
.legend i.hol { background: var(--magenta); border-color: var(--magenta); }

/* Credentials */
.cred { display: grid; gap: 12px; }
.cred-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px dashed var(--line-strong); border-radius: 12px; padding: 12px 14px; background: var(--surface-2); flex-wrap: wrap; }
.cred-row small { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 700; font-family: var(--font-display); }
.cred-row .mono { font-size: 18px; font-weight: 600; user-select: all; word-break: break-all; }

/* Modal + toast */
.overlay { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { width: min(560px, 100%); max-height: calc(100% - 32px); overflow-y: auto; background: var(--surface); border-radius: 20px; padding: 26px; box-shadow: 0 30px 80px rgba(20, 5, 60, .35); display: grid; gap: 18px; }
.modal h2 { font-size: 24px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }

.mobile-bar { display: none; }

@media (max-width: 1100px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split { grid-template-columns: minmax(0, 1fr); }
  .summary { position: static; }
}
@media (max-width: 860px) {
  .login { grid-template-columns: minmax(0, 1fr); }
  .login-hero { padding: 32px 20px; }
  .hero-cards { grid-template-columns: minmax(0, 1fr); }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; padding: 14px 16px; gap: 12px; border-right: 0; border-bottom: 1px solid var(--line); }
  .side-brand { display: flex; align-items: center; justify-content: space-between; padding: 0; }
  .nav { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 2px; }
  .nav button { white-space: nowrap; flex: none; }
  .side-foot { margin: 0; padding-top: 10px; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
  .side-foot .btn-row { display: flex; gap: 6px; }
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .approval { grid-template-columns: minmax(0, 1fr); }
  .approval .btns { grid-auto-flow: column; justify-content: start; }
  .main { padding-top: 22px; }
}
@media (max-width: 520px) {
  .grid-4 { grid-template-columns: minmax(0, 1fr); }
  .form-grid, .form-grid.hol-grid { grid-template-columns: minmax(0, 1fr); }
  .balance .big { font-size: 38px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  const STORE_KEY = 'swing-hris-attendance-v1';
  const GRADES = ['1.1', '1.2', '2.1', '2.2', '3.1', '3.2', '4.1', '4.2'];
  const COUNTRIES = { ID: 'Indonesia', MY: 'Malaysia' };
  const DEPARTMENTS = ['Product', 'Tech', 'Operations', 'Growth', 'Marketing', 'People', 'Finance', 'Regional', 'Business'];
  const LOGO_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M18.4 8.2A7.5 7.5 0 1 0 19.5 12"/><path d="M5 19 19.5 4.5"/><path d="M13.5 4.5h6v6"/></svg>';

  const app = document.getElementById('app');
  const ui = { view: null, reqFilter: 'all', approvalsTab: 'pending', calMonth: null, calCountry: 'all', holCountry: 'ID', empQuery: '', confirmCancel: null, modal: null, draft: null };

  // ---------- dates ----------
  const pad = n => String(n).padStart(2, '0');
  const toISO = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

  const todayISO = () => toISO(new Date());
  const addDays = (iso, n) => { const d = fromISO(iso); d.setDate(d.getDate() + n); return toISO(d); };
  const isWeekend = iso => { const g = fromISO(iso).getDay(); return g === 0 || g === 6; };
  const nextWorkday = (iso, n) => { let d = iso; while (isWeekend(d)) d = addDays(d, 1); let left = n || 0; while (left > 0) { d = addDays(d, 1); if (!isWeekend(d)) left--; } return d; };
  const fmt = (iso, opts) => fromISO(iso).toLocaleDateString('en-GB', opts || { day: 'numeric', month: 'short', year: 'numeric' });
  const fmtShort = iso => fmt(iso, { weekday: 'short', day: 'numeric', month: 'short' });
  const fmtRange = (a, b) => a === b ? fmt(a, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : fmt(a, { day: 'numeric', month: 'short' }) + ' - ' + fmt(b);

  // ---------- store ----------
  let state;

    try { const raw = localStorage.getItem(STORE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}

  const emp = id => state.employees.find(e => e.id === id);
  const leaveType = code => state.leaveTypes.find(t => t.code === code);
  const me = () => state.sessionUserId ? emp(state.sessionUserId) : null;
  const holidaysOf = (country, hol) => (hol || state.holidays)[country] || [];
  const holidayOn = (iso, country) => holidaysOf(country).find(h => h.date === iso);

  function countDays(start, end, country, half, hol) {
    const skipped = [];
    if (!start || !end || end < start) return { days: 0, skipped };
    let days = 0;
    for (let d = start; d <= end; d = addDays(d, 1)) {
      const h = holidaysOf(country, hol).find(x => x.date === d);
      if (isWeekend(d)) continue;
      if (h) { skipped.push({ date: d, name: h.name }); continue; }
      days++;
    }
    if (start === end && half && half !== 'none' && days === 1) days = 0.5;
    return { days, skipped };
  }

  function balance(e, code) {
    const t = leaveType(code);
    const year = String(new Date().getFullYear());
    const mine = state.requests.filter(r => r.empId === e.id && r.type === code && r.start.slice(0, 4) === year);
    const used = mine.filter(r => r.status === 'approved').reduce((a, r) => a + r.days, 0);
    const pending = mine.filter(r => r.status === 'pending').reduce((a, r) => a + r.days, 0);
    const quota = t.quota ? Number(t.quota[e.country]) : null;
    return { quota, used, pending, available: quota == null ? null : quota - used - pending };
  }

  function docRequired(t, days) {
    return t.docRule === 'always' || (t.docRule === 'over1' && days > 1);
  }

    const max = state.employees.reduce((m, e) => Math.max(m, Number(e.id.split('-')[2]) || 0), 0);

  }

  function generatePassword() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
    const buf = new Uint32Array(12);
    crypto.getRandomValues(buf);
    const raw = Array.from(buf, n => chars[n % chars.length]).join('');
    return raw.slice(0, 4) + '-' + raw.slice(4, 8) + '-' + raw.slice(8, 12);
  }

      return '<div><div class="eyebrow">New account</div><h2 style="margin-top:8px">Create an attendance account</h2><p class="muted" style="margin-top:6px">We generate the user ID and a temporary password. Email sign-in comes later.</p></div>' +
        '<form id="emp-form" class="stack" novalidate><div class="form-grid">' +
          '<label class="field full"><span>Full name</span><input class="input" id="ne-name" placeholder="e.g. Putri Anggraini"></label>' +
          '<label class="field full"><span>Work email <span class="faint" style="font-weight:400">(optional)</span></span><input class="input" type="email" id="ne-email" placeholder="name@getswing.app"><small>Saved on the profile for later. Not used for sign-in yet.</small></label>' +
          '<label class="field"><span>Country</span><select class="input" id="ne-country"><option value="ID">Indonesia</option><option value="MY">Malaysia</option></select></label>' +
          '<label class="field"><span>Department</span><select class="input" id="ne-dept">' + DEPARTMENTS.map(d => '<option>' + d + '</option>').join('') + '</select></label>' +
          '<label class="field"><span>Job title</span><input class="input" id="ne-title" placeholder="e.g. Operations Associate"></label>' +
          '<label class="field"><span>Grade</span><select class="input" id="ne-grade">' + GRADES.map(g => '<option>' + g + '</option>').join('') + '</select></label>' +
          '<label class="field"><span>Join date</span><input class="input" type="date" id="ne-join" value="' + todayISO() + '"></label>' +
          '<label class="field"><span>Access</span><select class="input" id="ne-role"><option value="employee">Employee</option><option value="admin">HR admin</option></select></label>' +
        '</div><p class="faint" id="ne-preview" style="font-size:13.5px"></p><p class="error-text" id="ne-error" hidden></p>' +
        '<div class="modal-actions"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">Create account</button></div></form>';
    }
    if (m.kind === 'creds') {
      const e = emp(m.id);
      const text = 'Swing HRIS - Attendance\nUser ID: ' + e.id + '\nTemporary password: ' + m.password + '\nYou will set your own password on first sign-in.';
      return '<div><div class="eyebrow">' + (m.reset ? 'Password reset' : 'Account created') + '</div><h2 style="margin-top:8px">Share these with ' + esc(e.name.split(' ')[0]) + '</h2><p class="muted" style="margin-top:6px">The temporary password is shown only once. ' + esc(e.name) + ' will be asked to set a new one at first sign-in.</p></div>' +
        '<div class="cred">' +
          '<div class="cred-row"><div><small>User ID</small><span class="mono">' + e.id + '</span></div><button class="btn sm" data-action="copy" data-text="' + esc(e.id) + '">Copy</button></div>' +
          '<div class="cred-row"><div><small>Temporary password</small><span class="mono">' + esc(m.password) + '</span></div><button class="btn sm" data-action="copy" data-text="' + esc(m.password) + '">Copy</button></div>' +
        '</div>' +
        '<div class="modal-actions"><button class="btn" data-action="copy" data-text="' + esc(text) + '">Copy both</button><button class="btn primary" data-action="close-modal">Done</button></div>';
    }
    if (m.kind === 'confirm-reset') {
      const e = emp(m.id);
      return '<div><div class="eyebrow">Reset password</div><h2 style="margin-top:8px">Reset password for ' + esc(e.name) + '?</h2><p class="muted" style="margin-top:6px">Their current password stops working right away. You get a new temporary password to share.</p></div>' +
        '<div class="modal-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="reset-pw-yes" data-id="' + e.id + '">Reset password</button></div>';
    }
    if (m.kind === 'confirm-deactivate') {
      const e = emp(m.id);
      return '<div><div class="eyebrow">Deactivate</div><h2 style="margin-top:8px">Deactivate ' + esc(e.name) + '?</h2><p class="muted" style="margin-top:6px">They can no longer sign in. Their leave history stays. You can reactivate the account any time.</p></div>' +
        '<div class="modal-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn danger" data-action="deactivate-yes" data-id="' + e.id + '">Deactivate</button></div>';
    }
    if (m.kind === 'reject') {
      const r = state.requests.find(x => x.id === m.id), e = emp(r.empId);
      return '<div><div class="eyebrow">Reject request</div><h2 style="margin-top:8px">Reject ' + esc(e.name.split(' ')[0]) + '\'s ' + leaveType(r.type).name.toLowerCase() + '?</h2><p class="muted" style="margin-top:6px">' + fmtRange(r.start, r.end) + ' · ' + fmtDays(r.days) + '</p></div>' +
        '<form id="reject-form" class="stack" novalidate><label class="field"><span>Reason for the employee</span><textarea class="input" id="rj-note" placeholder="e.g. Overlaps the stock-take week. Please move it by one week."></textarea></label><p class="error-text" id="rj-error" hidden></p>' +
        '<div class="modal-actions"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn danger" type="submit">Reject request</button></div></form>';
    }
    return '';
  }

  // ---------- wiring ----------
  function showError(id, msg) { const el = document.getElementById(id); if (!el) return; el.textContent = msg || ''; el.hidden = !msg; }

  function afterRender() {
    const u = me();
    const lf = document.getElementById('login-form');
    if (lf) lf.addEventListener('submit', ev => {
      ev.preventDefault();
      const id = document.getElementById('login-id').value.trim().toUpperCase();
      const pw = document.getElementById('login-pw').value;
      const e = emp(id);
      if (!id || !pw) return showError('login-error', 'Enter your user ID and password.');
      if (!e || e.password !== pw) return showError('login-error', 'User ID or password is incorrect. Check with your HR admin if you lost them.');
      if (!e.active) return showError('login-error', 'This account is deactivated. Ask your HR admin to reactivate it.');
      state.sessionUserId = e.id; ui.view = null; ui.draft = null; save(); render();
    });

    const ff = document.getElementById('force-form');
    if (ff) ff.addEventListener('submit', ev => {
      ev.preventDefault();
      const a = document.getElementById('fc-new').value, b = document.getElementById('fc-confirm').value;
      if (a.length < 8) return showError('fc-error', 'Use at least 8 characters.');
      if (a === u.password) return showError('fc-error', 'Choose a password different from the temporary one.');
      if (a !== b) return showError('fc-error', 'The two passwords do not match.');
      u.password = a; u.mustChange = false; save(); render(); toast('Password saved. Welcome to Swing HRIS.');
    });

    const pf = document.getElementById('pw-form');
    if (pf) pf.addEventListener('submit', ev => {
      ev.preventDefault();
      const cur = document.getElementById('pw-cur').value, a = document.getElementById('pw-new').value, b = document.getElementById('pw-confirm').value;
      if (cur !== u.password) return showError('pw-error', 'Current password is incorrect.');
      if (a.length < 8) return showError('pw-error', 'Use at least 8 characters.');
      if (a !== b) return showError('pw-error', 'The two new passwords do not match.');
      u.password = a; save(); render(); toast('Password updated');
    });

    const rf = document.getElementById('request-form');
    if (rf) {
      const sync = () => {
        const d = ui.draft, t = leaveType(d.type);
        const single = d.start && d.start === d.end;
        if (!single && d.half !== 'none') d.half = 'none';
        document.querySelectorAll('#rq-half button').forEach(b => { b.classList.toggle('on', b.dataset.half === d.half); b.disabled = !single && b.dataset.half !== 'none'; });
        const days = countDays(d.start, d.end, u.country, d.half).days;
        const need = docRequired(t, days);
        document.getElementById('rq-doc-label').textContent = need ? 'Supporting document (required)' : 'Supporting document (optional)';
        document.getElementById('rq-type-hint').textContent = t.code === 'SL' ? 'Two days or more needs a medical certificate (surat dokter / MC).' : t.hint ? t.hint + '. Attach proof.' : t.paid ? 'Paid. Deducted from your yearly balance.' : 'Unpaid. Not deducted from any balance.';
        document.getElementById('rq-summary').innerHTML = summaryHTML(u);
        showError('rq-error', '');
      };
      document.getElementById('rq-type').addEventListener('change', e => { ui.draft.type = e.target.value; sync(); });
      document.getElementById('rq-start').addEventListener('change', e => { ui.draft.start = e.target.value; if (!ui.draft.end || ui.draft.end < ui.draft.start) { ui.draft.end = ui.draft.start; document.getElementById('rq-end').value = ui.draft.end; } sync(); });
      document.getElementById('rq-end').addEventListener('change', e => { ui.draft.end = e.target.value; sync(); });
      document.getElementById('rq-reason').addEventListener('input', e => { ui.draft.reason = e.target.value; });
      document.getElementById('rq-doc').addEventListener('change', e => { const f = e.target.files[0]; ui.draft.attachment = f ? f.name : ''; document.getElementById('rq-doc-hint').textContent = f ? 'Attached: ' + f.name : 'PDF, JPG or PNG.'; sync(); });
      document.getElementById('rq-half').addEventListener('click', e => { const b = e.target.closest('button[data-half]'); if (!b || b.disabled) return; ui.draft.half = b.dataset.half; sync(); });
      rf.addEventListener('submit', ev => {
        ev.preventDefault();
        const err = validateDraft(u);
        if (err) return showError('rq-error', err);
        const d = ui.draft;
        state.seq.req++;
        const id = 'LV-' + String(state.seq.req).padStart(4, '0');
        state.requests.push({ id, empId: u.id, type: d.type, start: d.start, end: d.end, half: d.half, days: countDays(d.start, d.end, u.country, d.half).days, reason: d.reason.trim(), attachment: d.attachment, status: 'pending', createdAt: todayISO(), decidedBy: null, decidedAt: null, note: '' });
        save(); ui.draft = null; ui.view = 'mine'; ui.reqFilter = 'all'; render(); toast('Request ' + id + ' sent to People Ops');
      });
      sync();
    }

    const q = document.getElementById('emp-q');
    if (q) q.addEventListener('input', e => {
      ui.empQuery = e.target.value; const pos = e.target.selectionStart; render();
      const n = document.getElementById('emp-q'); n.focus(); n.setSelectionRange(pos, pos);
    });

    const polf = document.getElementById('policy-form');
    if (polf) polf.addEventListener('submit', ev => {
      ev.preventDefault();
      state.leaveTypes.forEach(t => { if (!t.quota) return; ['ID', 'MY'].forEach(c => { const v = Number(document.getElementById('q-' + t.code + '-' + c).value); if (Number.isFinite(v) && v >= 0) t.quota[c] = v; }); });
      save(); render(); toast('Leave quotas saved');
    });

    const hf = document.getElementById('hol-form');
    if (hf) hf.addEventListener('submit', ev => {
      ev.preventDefault();
      const date = document.getElementById('hol-date').value, name = document.getElementById('hol-name').value.trim();
      if (!date || !name) return showError('hol-error', 'Add both a date and a name.');
      if (holidayOn(date, ui.holCountry)) return showError('hol-error', fmt(date) + ' is already a holiday in ' + COUNTRIES[ui.holCountry] + '.');
      state.holidays[ui.holCountry].push({ date, name });
      save(); render(); toast(name + ' added to ' + COUNTRIES[ui.holCountry]);
    });

    const ef = document.getElementById('emp-form');
    if (ef) {
      const preview = () => { document.getElementById('ne-preview').textContent = 'User ID will be ' + nextEmpId(document.getElementById('ne-country').value) + '.'; };
      document.getElementById('ne-country').addEventListener('change', preview); preview();
      ef.addEventListener('submit', ev => {
        ev.preventDefault();
        const name = document.getElementById('ne-name').value.trim(), email = document.getElementById('ne-email').value.trim();
        if (name.length < 2) return showError('ne-error', 'Enter the employee\'s full name.');
        if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return showError('ne-error', 'That email does not look right. Leave it empty or fix it.');
        if (email && state.employees.some(e => e.email.toLowerCase() === email.toLowerCase())) return showError('ne-error', email + ' already belongs to another account.');
        const country = document.getElementById('ne-country').value;
        const password = generatePassword();
        const e = { id: nextEmpId(country), name, email, country, department: document.getElementById('ne-dept').value, title: document.getElementById('ne-title').value.trim() || 'Employee', grade: document.getElementById('ne-grade').value, role: document.getElementById('ne-role').value, joinDate: document.getElementById('ne-join').value || todayISO(), password, mustChange: true, active: true };
        state.employees.push(e); save();
        openModal({ kind: 'creds', id: e.id, password });
      });
    }

    const rjf = document.getElementById('reject-form');
    if (rjf) rjf.addEventListener('submit', ev => {
      ev.preventDefault();
      const note = document.getElementById('rj-note').value.trim();
      if (!note) return showError('rj-error', 'Add a short reason. The employee sees it on their request.');
      const r = state.requests.find(x => x.id === ui.modal.id);
      Object.assign(r, { status: 'rejected', note, decidedBy: u.id, decidedAt: todayISO() });
      save(); ui.modal = null; render(); toast(r.id + ' rejected');
    });
  }

  app.addEventListener('click', ev => {
    const nav = ev.target.closest('[data-nav]');
    if (nav) { ui.view = nav.dataset.nav; ui.confirmCancel = null; render(); window.scrollTo(0, 0); return; }
    const f = ev.target.closest('[data-filter]'); if (f) { ui.reqFilter = f.dataset.filter; render(); return; }
    const tab = ev.target.closest('[data-tab]'); if (tab) { ui.approvalsTab = tab.dataset.tab; render(); return; }
    const cc = ev.target.closest('[data-cal-country]'); if (cc) { ui.calCountry = cc.dataset.calCountry; render(); return; }
    const hc = ev.target.closest('[data-hol-country]'); if (hc) { ui.holCountry = hc.dataset.holCountry; render(); return; }
    if (ev.target.classList.contains('overlay')) { closeModal(); return; }
    const a = ev.target.closest('[data-action]');
    if (!a) return;
    const id = a.dataset.id, u = me();
    switch (a.dataset.action) {
      case 'demo': {
        const e = emp(id);
        document.getElementById('login-id').value = e.id;
        document.getElementById('login-pw').value = e.password;
        showError('login-error', '');
        break;
      }
      case 'toggle-pw': { const i = document.getElementById('login-pw'); i.type = i.type === 'password' ? 'text' : 'password'; a.textContent = i.type === 'password' ? 'Show' : 'Hide'; break; }
      case 'logout': state.sessionUserId = null; ui.view = null; ui.modal = null; ui.draft = null; save(); render(); break;
      case 'reset-demo': try { localStorage.removeItem(STORE_KEY); } catch (e) {} state = seed(); ui.view = null; ui.draft = null; render(); toast('Demo data reset'); break;
      case 'reset-draft': ui.draft = null; render(); break;
      case 'cancel-ask': ui.confirmCancel = id; render(); break;
      case 'cancel-no': ui.confirmCancel = null; render(); break;
      case 'cancel-yes': { const r = state.requests.find(x => x.id === id); r.status = 'cancelled'; ui.confirmCancel = null; save(); render(); toast(r.id + ' cancelled'); break; }
      case 'approve': { const r = state.requests.find(x => x.id === id); Object.assign(r, { status: 'approved', decidedBy: u.id, decidedAt: todayISO(), note: '' }); save(); render(); toast(r.id + ' approved for ' + emp(r.empId).name); break; }
      case 'reject': openModal({ kind: 'reject', id }); break;
      case 'add-emp': openModal({ kind: 'add-emp' }); break;
      case 'close-modal': closeModal(); break;
      case 'copy': copy(a.dataset.text, a); break;
      case 'reset-pw': openModal({ kind: 'confirm-reset', id }); break;
      case 'reset-pw-yes': { const e = emp(id); const password = generatePassword(); e.password = password; e.mustChange = true; save(); openModal({ kind: 'creds', id, password, reset: true }); break; }
      case 'toggle-active': { const e = emp(id); if (e.active) openModal({ kind: 'confirm-deactivate', id }); else { e.active = true; save(); render(); toast(e.name + ' reactivated'); } break; }
      case 'deactivate-yes': { const e = emp(id); e.active = false; save(); ui.modal = null; render(); toast(e.name + ' deactivated'); break; }
      case 'hol-remove': { const list = state.holidays[ui.holCountry]; const i = list.findIndex(h => h.date === a.dataset.date); if (i >= 0) list.splice(i, 1); save(); render(); toast(a.dataset.name + ' removed'); break; }
      case 'cal-prev': case 'cal-next': { const d = fromISO(ui.calMonth + '-01'); d.setMonth(d.getMonth() + (a.dataset.action === 'cal-next' ? 1 : -1)); ui.calMonth = toISO(d).slice(0, 7); render(); break; }
      case 'cal-today': ui.calMonth = todayISO().slice(0, 7); render(); break;
    }
  });

  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && ui.modal) closeModal(); });

  state = load();
  render();
})();
</script>
</body>
</html>
