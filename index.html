<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swing HRIS Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: fixed sidebar + scrolling workspace. Monochrome Swing: black on white, Swing purple as the only accent. */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #F5F5F6;
  --line: #E7E7EA;
  --line-strong: #CDCDD3;
  --ink: #0B0B0F;
  --on-ink: #FFFFFF;
  --muted: #55555E;
  --faint: #8B8B94;
  --accent: #6A1DE4;
  --accent-soft: #F3EEFF;
  --accent-line: #D9C8FA;
  --hero: #0B0B0F;
  --hero-ink: #FFFFFF;
  --hero-muted: rgba(255,255,255,.72);
  --hero-line: rgba(255,255,255,.16);
  --hero-glow: rgba(106, 29, 228, .55);
  --ok: #0F7A57; --ok-bg: #E6F4EE;
  --warn: #8A5300; --warn-bg: #FFF3DC;
  --bad: #B3253A; --bad-bg: #FCE9EC;
  --shadow: 0 1px 2px rgba(11, 11, 15, .04), 0 6px 20px rgba(11, 11, 15, .05);
  --overlay: rgba(11, 11, 15, .5);
  --font-display: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Karla", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 16px;
  --radius-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0B0F; --surface: #131317; --surface-2: #1B1B21; --line: #26262D; --line-strong: #3A3A44;
    --ink: #F4F4F6; --on-ink: #0B0B0F; --muted: #B0B0BA; --faint: #7C7C87;
    --accent: #B794FF; --accent-soft: #1F1830; --accent-line: #4A3A7A;
    --hero: #131317; --hero-glow: rgba(140, 80, 255, .45);
    --ok: #55D6A5; --ok-bg: #11302A; --warn: #F3B85E; --warn-bg: #33270F; --bad: #FF8494; --bad-bg: #3A1821;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --overlay: rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0B0F; --surface: #131317; --surface-2: #1B1B21; --line: #26262D; --line-strong: #3A3A44;
  --ink: #F4F4F6; --on-ink: #0B0B0F; --muted: #B0B0BA; --faint: #7C7C87;
  --accent: #B794FF; --accent-soft: #1F1830; --accent-line: #4A3A7A;
  --hero: #131317; --hero-glow: rgba(140, 80, 255, .45);
  --ok: #55D6A5; --ok-bg: #11302A; --warn: #F3B85E; --warn-bg: #33270F; --bad: #FF8494; --bad-bg: #3A1821;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --overlay: rgba(0, 0, 0, .7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: .9em; }

.eyebrow { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 11.5px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.eyebrow::before { content: ""; width: 22px; height: 2px; background: currentColor; border-radius: 2px; }
.label { font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.accent { color: var(--accent); }

.logo { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.03em; color: var(--ink); }
.logo svg { width: 24px; height: 24px; color: var(--accent); }
.logo.on-hero { color: var(--hero-ink); }
.logo.on-hero svg { color: var(--hero-ink); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 9px 18px; font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 1.2; background: var(--surface); color: var(--ink); transition: background .12s ease, border-color .12s ease, color .12s ease; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--bad); border-color: var(--bad-bg); background: var(--bad-bg); }
.btn.ok { color: var(--ok); border-color: var(--ok-bg); background: var(--ok-bg); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 10px; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-weight: 600; font-size: 13.5px; }
.field small { color: var(--faint); font-size: 12.5px; }
.input { width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius-sm); padding: 10px 12px; min-height: 42px; }
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.sm { min-height: 34px; padding: 5px 8px; font-size: 13.5px; border-radius: 8px; }
.input.missing { border-color: var(--warn); background: var(--warn-bg); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.form-grid .full { grid-column: 1 / -1; }
.form-grid.hol-grid { grid-template-columns: minmax(0, 180px) minmax(0, 1fr) auto; align-items: end; }
.error-text { color: var(--bad); font-size: 13.5px; font-weight: 600; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--on-ink); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; min-width: 0; }
.card.hl { background: var(--accent-soft); border-color: var(--accent-line); box-shadow: none; }
.card.dark { background: var(--hero); color: var(--hero-ink); border: 0; background-image: radial-gradient(90% 70% at 100% 100%, var(--hero-glow), transparent 65%); }
.card.dark .label { color: var(--hero-ink); opacity: .8; }
.card.dark .muted { color: var(--hero-muted); }
.card h3 { font-size: 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.stack { display: grid; gap: 18px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.split { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.pending { color: var(--warn); background: var(--warn-bg); }
.pill.approved, .pill.active { color: var(--ok); background: var(--ok-bg); }
.pill.rejected, .pill.inactive { color: var(--bad); background: var(--bad-bg); }
.pill.cancelled { color: var(--faint); background: var(--surface-2); }
.tag { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 6px; font-size: 12px; font-weight: 700; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line); white-space: nowrap; }
.tag.plain { background: var(--surface-2); color: var(--muted); border-color: var(--line); }

.table-wrap { overflow-x: auto; margin-inline: -4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-family: var(--font-display); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); font-weight: 700; padding: 10px 12px; border-bottom: 1.5px solid var(--ink); white-space: nowrap; }
td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.actions { white-space: nowrap; text-align: right; }
td .input.sm { width: auto; min-width: 140px; }

/* Login */
.login { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.login-hero { position: relative; overflow: hidden; background: var(--hero); color: var(--hero-ink); padding: 48px clamp(24px, 5vw, 72px); display: flex; flex-direction: column; justify-content: space-between; gap: 40px; background-image: radial-gradient(80% 60% at 100% 100%, var(--hero-glow), transparent 70%); }
.login-hero .mark { position: absolute; right: -90px; top: -60px; width: 420px; height: 420px; color: var(--hero-ink); opacity: .06; pointer-events: none; }
.login-hero .eyebrow { color: var(--hero-ink); opacity: .85; }
.login-hero h1 { font-size: clamp(36px, 5vw, 60px); line-height: 1.02; font-weight: 800; margin-block: 18px 16px; }
.login-hero h1 em { font-style: normal; color: #B794FF; }
.login-hero p { font-size: 17px; max-width: 46ch; color: var(--hero-muted); }
.hero-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; position: relative; }
.hero-cards div { border: 1px solid var(--hero-line); background: rgba(255,255,255,.04); border-radius: 14px; padding: 14px; font-size: 13.5px; color: var(--hero-muted); }
.hero-cards strong { display: block; font-family: var(--font-display); font-size: 16px; margin-top: 4px; color: var(--hero-ink); }
.login-panel { display: grid; place-items: center; padding: 40px 24px; }
.login-box { width: min(420px, 100%); display: grid; gap: 22px; }
.login-box h2 { font-size: 30px; }
.pw-wrap { position: relative; }
.pw-wrap .input { padding-right: 70px; }
.pw-wrap button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }

/* Shell */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.side-brand { display: grid; gap: 6px; padding-inline: 8px; }
.side-brand small { font-family: var(--font-display); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
.nav { display: grid; }
.nav-group { display: grid; gap: 2px; }
.nav-group + .nav-group { margin-top: 14px; }
.nav-label { font-family: var(--font-display); font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); padding: 0 12px 4px; }
.nav button { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 0; background: transparent; text-align: left; padding: 9px 12px; border-radius: 10px; font-weight: 600; color: var(--muted); }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button.on { background: var(--ink); color: var(--on-ink); }
.nav .count { min-width: 22px; padding: 1px 7px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; text-align: center; }
.side-foot { margin-top: auto; display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.me { display: flex; gap: 10px; align-items: center; padding-inline: 4px; min-width: 0; }
.me div { min-width: 0; }
.me b { display: block; font-family: var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--on-ink); font-family: var(--font-display); font-weight: 700; font-size: 13px; }
.avatar.leader { background: var(--accent); color: #fff; }
.avatar.lg { width: 44px; height: 44px; font-size: 15px; }
.main { padding: 32px clamp(16px, 4vw, 44px) 64px; display: grid; gap: 24px; align-content: start; min-width: 0; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: clamp(28px, 3.4vw, 40px); font-weight: 800; margin-top: 8px; }
.page-head p { color: var(--muted); margin-top: 6px; max-width: 68ch; }

/* Tiles */
.tile .big { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1; margin-top: 12px; }
.tile .big.accent { color: var(--accent); }
.tile .of { color: var(--muted); font-size: 14px; margin-top: 6px; }
.tile .meta { display: flex; gap: 6px 14px; font-size: 13px; color: var(--muted); margin-top: 12px; flex-wrap: wrap; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 14px; }
.dots i { width: 10px; height: 10px; border-radius: 3px; background: var(--line); }
.dots i.avail { background: var(--accent); }
.dots i.used { background: var(--ink); }
.dots i.pend { background: transparent; border: 1.5px dashed var(--accent); }

.list { display: grid; }
.list-item { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.list-item:last-child { border-bottom: 0; padding-bottom: 0; }
.list-item:first-child { padding-top: 0; }
.list-item .grow { flex: 1; min-width: 0; }
.list-item b { font-family: var(--font-display); }
.date-chip { flex: none; width: 52px; border-radius: 12px; border: 1px solid var(--line-strong); text-align: center; padding: 6px 0; line-height: 1.1; }
.date-chip b { display: block; font-size: 20px; color: var(--ink); }
.date-chip small { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.empty { color: var(--faint); padding: 18px 0; text-align: center; }

.approval { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: start; }
.approval .who { display: flex; gap: 12px; align-items: center; }
.approval .facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 14px; font-size: 14px; }
.approval .facts div { display: grid; }
.approval .facts small { color: var(--faint); font-size: 12px; font-weight: 600; }
.approval blockquote { margin: 14px 0 0; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 10px 10px 0; font-size: 14px; }
.approval .btns { display: grid; gap: 8px; }

.note { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; background: var(--accent-soft); border: 1px solid var(--accent-line); font-size: 14px; }
.note.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.note b { font-family: var(--font-display); }

.summary { position: sticky; top: 24px; }
.summary dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; margin: 16px 0 0; font-size: 14px; }
.summary dt { color: var(--hero-muted); }
.summary dd { margin: 0; text-align: right; font-weight: 700; }
.summary .days { font-family: var(--font-display); font-size: 56px; font-weight: 800; line-height: 1; margin-top: 10px; }
.skipped { margin-top: 14px; display: grid; gap: 6px; font-size: 13px; }
.skipped span { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,.08); }

.cal-wrap { overflow-x: auto; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(110px, 1fr)); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 770px; }
.cal .dow { background: var(--ink); color: var(--on-ink); padding: 8px 10px; font-family: var(--font-display); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
.cal .day { min-height: 108px; padding: 8px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); display: grid; gap: 4px; align-content: start; background: var(--surface); }
.cal .day:nth-child(7n+1) { border-left: 0; }
.cal .day.out { background: var(--bg); }
.cal .day.out .d { color: var(--faint); }
.cal .day.weekend { background: var(--surface-2); }
.cal .day.today .d { background: var(--accent); color: #fff; border-radius: 999px; padding: 0 7px; justify-self: start; }
.cal .d { font-family: var(--font-display); font-weight: 700; font-size: 14px; }
.cal .hol { font-size: 11.5px; font-weight: 700; color: var(--accent); line-height: 1.25; }
.cal .who { font-size: 12px; padding: 2px 7px; border-radius: 6px; background: var(--ink); color: var(--on-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal .who.pend { background: transparent; color: var(--muted); border: 1px dashed var(--line-strong); }
.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 10px; border-radius: 3px; display: inline-block; background: var(--ink); }
.legend i.pend { border: 1px dashed var(--line-strong); background: transparent; }
.legend i.hol { background: var(--accent); }

.org { display: grid; gap: 10px; }
.org > *, .org-children > *, .org-item { min-width: 0; }
.org-children { display: grid; gap: 10px; margin-left: 22px; padding-left: 18px; border-left: 2px solid var(--line-strong); }
.org-node { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.org-node.leader { border-color: var(--accent-line); background: var(--accent-soft); }
.org-node .grow { flex: 1; min-width: 160px; }
.org-node b { font-family: var(--font-display); }
.org-node select { width: auto; max-width: 100%; min-height: 36px; padding: 6px 10px; font-size: 13.5px; }

.cred { display: grid; gap: 12px; }
.cred-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px dashed var(--line-strong); border-radius: 12px; padding: 12px 14px; background: var(--surface-2); flex-wrap: wrap; }
.cred-row small { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 700; font-family: var(--font-display); }
.cred-row .mono { font-size: 18px; font-weight: 600; user-select: all; word-break: break-all; }

.overlay { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { width: min(560px, 100%); max-height: calc(100% - 32px); overflow-y: auto; background: var(--surface); border-radius: 20px; padding: 26px; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); display: grid; gap: 18px; }
.modal h2 { font-size: 24px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--on-ink); padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); text-align: center; }

@media (max-width: 1100px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split { grid-template-columns: minmax(0, 1fr); }
  .summary { position: static; }
}
@media (max-width: 860px) {
  .login { grid-template-columns: minmax(0, 1fr); }
  .login-hero { padding: 32px 20px; }
  .hero-cards { grid-template-columns: minmax(0, 1fr); }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; padding: 14px 16px; gap: 12px; border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
  .side-brand { display: flex; align-items: center; justify-content: space-between; padding: 0; }
  .nav { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 2px; }
  .nav-group { display: contents; }
  .nav-label { display: none; }
  .nav button { white-space: nowrap; flex: none; }
  .side-foot { margin: 0; padding-top: 10px; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .approval { grid-template-columns: minmax(0, 1fr); }
  .approval .btns { grid-auto-flow: column; justify-content: start; }
  .main { padding-top: 22px; }

}

  .tile .big { font-size: 38px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function () {
  const STORE_KEY = 'swing-hris-attendance-v3';
  const PRELOADED_ROSTER = /*ROSTER*/null/*END*/;
  const ROLE_LABEL = { admin: 'HR admin', leader: 'Leader', reportee: 'Reportee' };
  const STATUS_LABEL = { FT: 'Full time', PT: 'Part time' };
  const COUNTRIES = { ID: 'Indonesia', MY: 'Malaysia' };
  const LEAVE_TYPES = [
    { code: 'PL', name: 'Paid leave', hint: 'Uses your earned paid leave balance.' },
    { code: 'SL', name: 'Sick leave', hint: 'Attach a surat sakit (doctor\'s note). Does not use your paid leave balance.' },
    { code: 'OL', name: 'Other leave', hint: 'Tell your leader what the leave is for. Does not use your paid leave balance.' }
  ];
  const LOGO_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M18.4 8.2A7.5 7.5 0 1 0 19.5 12"/><path d="M5 19 19.5 4.5"/><path d="M13.5 4.5h6v6"/></svg>';

  const app = document.getElementById('app');
  const ui = { view: null, reqFilter: 'all', approvalsTab: 'pending', calMonth: null, calCountry: 'all', holCountry: 'ID', empQuery: '', empFilter: 'all', confirmCancel: null, modal: null, draft: null, revealed: null };

  // ---------- dates ----------
  const pad = n => String(n).padStart(2, '0');
  const toISO = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const fromISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const todayISO = () => toISO(new Date());
  const thisYear = () => new Date().getFullYear();
  const addDays = (iso, n) => { const d = fromISO(iso); d.setDate(d.getDate() + n); return toISO(d); };
  const addMonths = (iso, k) => {
    const [y, m, d] = iso.split('-').map(Number);
    const target = new Date(y, m - 1 + k, 1);
    const last = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
    target.setDate(Math.min(d, last));
    return toISO(target);
  };
  const isWeekend = iso => { const g = fromISO(iso).getDay(); return g === 0 || g === 6; };
  const nextWorkday = (iso, n) => { let d = iso; while (isWeekend(d)) d = addDays(d, 1); let left = n || 0; while (left > 0) { d = addDays(d, 1); if (!isWeekend(d)) left--; } return d; };
  const fmt = (iso, opts) => fromISO(iso).toLocaleDateString('en-GB', opts || { day: 'numeric', month: 'short', year: 'numeric' });
  const fmtShort = iso => fmt(iso, { weekday: 'short', day: 'numeric', month: 'short' });
  const fmtRange = (a, b) => a === b ? fmt(a, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : fmt(a, { day: 'numeric', month: 'short' }) + ' - ' + fmt(b);
  const fmtNum = n => Number.isInteger(n) ? String(n) : n.toFixed(1);
  const fmtDays = n => fmtNum(n) + (n === 1 ? ' day' : ' days');

  // ---------- seed ----------
  function seedHolidays() {
    return {
      ID: [
        ['2026-01-01', 'New Year\'s Day'], ['2026-01-16', 'Isra Mi\'raj'], ['2026-02-17', 'Chinese New Year'],
        ['2026-03-19', 'Nyepi (Day of Silence)'], ['2026-03-20', 'Idul Fitri'], ['2026-03-21', 'Idul Fitri (day 2)'],
        ['2026-04-03', 'Good Friday'], ['2026-05-01', 'Labour Day'], ['2026-05-14', 'Ascension of Jesus Christ'],
        ['2026-05-27', 'Idul Adha'], ['2026-05-31', 'Vesak Day'], ['2026-06-01', 'Pancasila Day'],
        ['2026-06-16', 'Islamic New Year'], ['2026-08-17', 'Independence Day'], ['2026-08-25', 'Prophet Muhammad\'s Birthday'],
        ['2026-12-25', 'Christmas Day']
      ].map(([date, name]) => ({ date, name })),
      MY: [
        ['2026-01-01', 'New Year\'s Day'], ['2026-02-01', 'Thaipusam'], ['2026-02-17', 'Chinese New Year'],
        ['2026-02-18', 'Chinese New Year (day 2)'], ['2026-03-20', 'Hari Raya Aidilfitri'], ['2026-03-21', 'Hari Raya Aidilfitri (day 2)'],
        ['2026-05-01', 'Labour Day'], ['2026-05-27', 'Hari Raya Haji'], ['2026-05-31', 'Wesak Day'],
        ['2026-06-01', 'Agong\'s Birthday'], ['2026-06-17', 'Awal Muharram'], ['2026-08-25', 'Prophet Muhammad\'s Birthday'],
        ['2026-08-31', 'Merdeka Day'], ['2026-09-16', 'Malaysia Day'], ['2026-11-08', 'Deepavali'], ['2026-12-25', 'Christmas Day']
      ].map(([date, name]) => ({ date, name }))
    };
  }

  function rosterToEmployee(p) {
    return { id: p.username, name: p.name, status: p.ftpt === 'PT' ? 'PT' : 'FT', title: p.title || '', country: 'ID', joinDate: p.joinDate || '', managerId: null,
      role: p.access === 'Leader' ? 'leader' : p.access === 'HR admin' ? 'admin' : 'reportee', password: p.password, mustChange: true, active: true };
  }

  function seed() {
    return {
      seq: { req: 0 },
      sessionUserId: null,
      policy: { perMonth: 1, carryCap: 5 },
      holidays: seedHolidays(),
      employees: [{ id: 'admin', name: 'People Ops Admin', status: 'FT', country: 'ID', joinDate: '', managerId: null, role: 'admin', system: true, password: 'swing-admin', mustChange: false, active: true }]
        .concat((PRELOADED_ROSTER || []).map(rosterToEmployee)),
      requests: []
    };
  }

  // ---------- store ----------
  let state;
  function load() {
    try { const raw = localStorage.getItem(STORE_KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) {}
    return seed();
  }
  // Older saves used a 2-year validity rule and kept GSA rows as separate accounts.
  function migrate(s) {
    if (s.policy.carryCap == null) s.policy = { perMonth: s.policy.perMonth || 1, carryCap: 5 };
    const merged = {};
    s.employees = s.employees.filter(e => { if (/\.gsa\d*$/.test(e.id)) { merged[e.id] = e.id.replace(/\.gsa\d*$/, ''); return false; } delete e.entity; return true; });
    s.employees.forEach(e => { if (merged[e.managerId]) e.managerId = merged[e.managerId]; });
    s.requests.forEach(r => { if (merged[r.empId]) r.empId = merged[r.empId]; });
    if (merged[s.sessionUserId]) s.sessionUserId = null;
    return s;
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

  // ---------- domain ----------
  const emp = id => state.employees.find(e => e.id === id);
  const leaveType = code => LEAVE_TYPES.find(t => t.code === code);
  const me = () => state.sessionUserId ? emp(state.sessionUserId) : null;
  const people = () => state.employees.filter(e => !e.system);
  const holidaysOf = country => state.holidays[country] || [];
  const holidayOn = (iso, country) => holidaysOf(country).find(h => h.date === iso);
  const typeLabel = r => leaveType(r.type).name + (r.type === 'OL' && r.specify ? ': ' + esc(r.specify) : '');

  function countDays(start, end, country, half) {
    const skipped = [];
    if (!start || !end || end < start) return { days: 0, skipped };
    let days = 0;
    for (let d = start; d <= end; d = addDays(d, 1)) {
      if (isWeekend(d)) continue;
      const h = holidayOn(d, country);
      if (h) { skipped.push({ date: d, name: h.name }); continue; }
      days++;
    }
    if (start === end && half && half !== 'none' && days === 1) days = 0.5;
    return { days, skipped };
  }

  // Paid leave: perMonth days earned on each monthly anniversary of the join date, full time and part time alike.
  // The balance resets each year. Up to carryCap unused days earned in year Y move into Y+1 and expire on 31 Dec of Y+1.
  // Leave in a year uses carried-over days first, then days earned that year.
  function paidLedger(e, extra) {
    const t = todayISO(), year = thisYear(), cap = state.policy.carryCap, per = state.policy.perMonth;
    const earned = {};
    let firstYear = year;
    if (e.joinDate) {
      firstYear = Math.min(year, Number(e.joinDate.slice(0, 4)));
      for (let k = 1; k < 1200; k++) {
        const d = addMonths(e.joinDate, k);
        if (d > t) break;
        const y = Number(d.slice(0, 4));
        earned[y] = (earned[y] || 0) + per;
      }
    }
    const uses = state.requests.filter(r => r.empId === e.id && r.type === 'PL' && (r.status === 'approved' || r.status === 'pending'))
      .concat(extra ? [extra] : []).sort((a, b) => a.start.localeCompare(b.start));
    const lastYear = uses.reduce((m, r) => Math.max(m, Number(r.start.slice(0, 4))), year);
    const years = {};
    let carryIn = 0, short = 0, shortTotal = 0;
    for (let y = firstYear; y <= lastYear + 1; y++) {
      let carry = carryIn, fresh = earned[y] || 0;
      uses.filter(r => Number(r.start.slice(0, 4)) === y).forEach(r => {
        let need = r.days, take = Math.min(carry, need);
        carry -= take; need -= take;
        take = Math.min(fresh, need); fresh -= take; need -= take;
        shortTotal += need;
        if (r === extra) short = need;
      });
      years[y] = { carryIn, carryLeft: carry, earned: earned[y] || 0, freshLeft: fresh };
      carryIn = Math.min(cap, fresh);
    }
    const validAt = d => { const y = years[Number(d.slice(0, 4))]; return y ? y.carryLeft + y.freshLeft : 0; };
    const cur = years[year];
    const mine = state.requests.filter(r => r.empId === e.id && r.type === 'PL' && r.start.slice(0, 4) === String(year));
    const next = e.joinDate ? (() => { let k = 1, d; do { d = addMonths(e.joinDate, k++); } while (d <= t); return d; })() : null;
    return {
      hasJoin: !!e.joinDate,
      available: validAt(t),
      earnedThisYear: cur.earned,
      carried: cur.carryIn,
      carriedLeft: cur.carryLeft,
      carryToNext: Math.min(cap, cur.freshLeft),
      lostAtYearEnd: cur.carryLeft + Math.max(0, cur.freshLeft - cap),
      used: mine.filter(r => r.status === 'approved').reduce((a, r) => a + r.days, 0),
      pending: mine.filter(r => r.status === 'pending').reduce((a, r) => a + r.days, 0),
      next, short, shortTotal, validAt
    };
  }
  const takenThisYear = (e, code) => state.requests.filter(r => r.empId === e.id && r.type === code && r.status === 'approved' && r.start.slice(0, 4) === String(thisYear())).reduce((a, r) => a + r.days, 0);

  const directReports = id => state.employees.filter(e => e.managerId === id);
  const isLeader = u => u.role === 'leader' || (u.role === 'admin' && directReports(u.id).length > 0);
  function canApprove(u, r) {
    if (!u || r.empId === u.id || r.status !== 'pending') return false;
    if (u.role === 'admin') return true;
    return u.role === 'leader' && emp(r.empId).managerId === u.id;
  }
  function approverLabel(e) {
    const m = e.managerId && emp(e.managerId);
    return m && m.active ? esc(m.name) + ' or People Ops' : 'People Ops';
  }
  function isBelow(candidateId, rootId) {
    let cur = emp(candidateId), guard = 0;
    while (cur && cur.managerId && guard++ < 200) { if (cur.managerId === rootId) return true; cur = emp(cur.managerId); }
    return false;
  }
  function leaderOptions(forId, selected, blankLabel) {
    const opts = state.employees.filter(e => !e.system && (e.active || e.id === selected) && e.id !== forId && (e.role === 'leader' || e.role === 'admin') && !(forId && isBelow(e.id, forId)));
    return '<option value="">' + (blankLabel || 'Not set (People Ops approves)') + '</option>' + opts.map(e => '<option value="' + e.id + '"' + (selected === e.id ? ' selected' : '') + '>' + esc(e.name) + '</option>').join('');
  }

  function makeUsername(name) {
    const tokens = name.toLowerCase().replace(/[^a-z ]/g, ' ').split(/\s+/).filter(t => t.length > 1);
    if (!tokens.length) return null;
    const base = (tokens.length === 1 ? tokens[0] : tokens[0] + '.' + tokens[tokens.length - 1]);
    let cand = base, n = 2;
    while (emp(cand)) cand = base + n++;
    return cand;
  }
  function generatePassword() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
    const buf = new Uint32Array(12);
    crypto.getRandomValues(buf);
    const raw = Array.from(buf, n => chars[n % chars.length]).join('');
    return raw.slice(0, 4) + '-' + raw.slice(4, 8) + '-' + raw.slice(8, 12);
  }

  const initials = name => name.replace(/\(.*?\)/g, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const statusPill = s => '<span class="pill ' + s + '">' + s[0].toUpperCase() + s.slice(1) + '</span>';
  const isOn = (r, iso) => r.start <= iso && r.end >= iso && !isWeekend(iso);
  const avatar = (e, extra) => '<span class="avatar' + (e.role !== 'reportee' ? ' leader' : '') + (extra ? ' ' + extra : '') + '">' + initials(e.name) + '</span>';
  const subline = e => (e.title ? esc(e.title) + ' · ' : '') + STATUS_LABEL[e.status] + (e.role !== 'reportee' ? ' · ' + ROLE_LABEL[e.role] : '');

  // ---------- toast / modal ----------
  let toastTimer;
  function toast(msg) {
    let el = document.querySelector('.toast');
    if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2800);
  }
  function openModal(m) { ui.modal = m; render(); }
  function closeModal() { ui.modal = null; render(); }
  function copy(text, btn) {
    const done = () => { toast('Copied to clipboard'); if (btn) { const o = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = o; }, 1500); } };
    try { navigator.clipboard.writeText(text).then(done, () => toast('Copy is blocked here. Select the text and copy it manually.')); }
    catch (e) { toast('Copy is blocked here. Select the text and copy it manually.'); }
  }

  // ---------- render root ----------
  function render() {
    const u = me();
    if (!u) app.innerHTML = loginView();
    else if (u.mustChange) app.innerHTML = forceChangeView(u);
    else app.innerHTML = shellView(u);
    if (ui.modal) app.insertAdjacentHTML('beforeend', '<div class="overlay"><div class="modal" role="dialog" aria-modal="true">' + modalView(ui.modal) + '</div></div>');
    afterRender();
  }

  const HERO_MARK = '<svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18.4 8.2A7.5 7.5 0 1 0 19.5 12"/><path d="M5 19 19.5 4.5"/><path d="M13.5 4.5h6v6"/></svg>';

  function loginView() {
    return '<div class="login">' +
      '<section class="login-hero">' + HERO_MARK +
        '<div class="logo on-hero">' + LOGO_SVG + 'swing</div>' +
        '<div><div class="eyebrow">People · HRIS · Attendance</div>' +
        '<h1>Time off,<br><em>in one place.</em></h1>' +
        '<p>Pick your dates and submit. Paid leave builds up every month from your join date. Your leader or People Ops approves it.</p></div>' +
        '<div class="hero-cards">' +
          '<div>Paid leave<strong>+1 day every month</strong></div>' +
          '<div>Sick leave<strong>With surat sakit</strong></div>' +
          '<div>Carry over<strong>Up to ' + state.policy.carryCap + ' days</strong></div>' +
        '</div>' +
      '</section>' +
      '<section class="login-panel"><div class="login-box">' +
        '<div><h2>Sign in</h2><p class="muted" style="margin-top:6px">Use the username and temporary password from People Ops.</p></div>' +
        '<form id="login-form" class="stack" novalidate>' +
          '<label class="field"><span>Username</span><input class="input mono" id="login-id" autocomplete="username" placeholder="e.g. firstname.lastname" autocapitalize="none" spellcheck="false"></label>' +
          '<label class="field"><span>Password</span><div class="pw-wrap"><input class="input" id="login-pw" type="password" autocomplete="current-password"><button type="button" class="btn ghost sm" data-action="toggle-pw">Show</button></div></label>' +
          '<p class="error-text" id="login-error" hidden></p>' +
          '<button class="btn primary" type="submit">Sign in</button>' +
        '</form>' +
        '<div class="note"><div><b>Email sign-in is not connected yet.</b> People Ops gives you a username and a temporary password. You set your own password the first time you sign in.</div></div>' +
        '<div class="note" style="background:var(--surface-2);border-color:var(--line)"><div><b>Prototype.</b> HR admin signs in with <span class="mono">admin</span> / <span class="mono">swing-admin</span>.' + (PRELOADED_ROSTER ? ' Employee credentials are in the master data file.' : ' Import the master data file from Employees &amp; access to create employee accounts.') + '</div></div>' +
      '</div></section>' +
    '</div>';
  }

  function forceChangeView(u) {
    return '<div class="login"><section class="login-hero">' + HERO_MARK + '<div class="logo on-hero">' + LOGO_SVG + 'swing</div>' +
      '<div><div class="eyebrow">Welcome, ' + esc(u.name.split(' ')[0]) + '</div><h1>Set your own <em>password.</em></h1><p>You signed in with a temporary password from People Ops. Choose a new one to continue. Your username stays <span class="mono">' + esc(u.id) + '</span>.</p></div><div></div></section>' +
      '<section class="login-panel"><div class="login-box"><h2>New password</h2>' +
      '<form id="force-form" class="stack" novalidate>' +
        '<label class="field"><span>New password</span><input class="input" id="fc-new" type="password" autocomplete="new-password"><small>At least 8 characters.</small></label>' +
        '<label class="field"><span>Confirm new password</span><input class="input" id="fc-confirm" type="password" autocomplete="new-password"></label>' +
        '<p class="error-text" id="fc-error" hidden></p>' +
        '<button class="btn primary" type="submit">Save and continue</button>' +
        '<button class="btn ghost" type="button" data-action="logout">Sign out</button>' +
      '</form></div></section></div>';
  }

  // ---------- shell ----------
  function navFor(u) {
    const teamPending = state.requests.filter(r => r.status === 'pending' && emp(r.empId).managerId === u.id).length;
    const allPending = state.requests.filter(r => canApprove(u, r)).length;
    const groups = [];
    if (!u.system) groups.push({ label: 'My leave', items: [['overview', 'Overview'], ['request', 'Request leave'], ['mine', 'My requests'], ['holidays', 'Public holidays']] });
    if (isLeader(u)) groups.push({ label: 'My team', items: [['t-approvals', 'Team approvals', teamPending], ['t-team', 'Team members'], ['t-calendar', 'Team calendar']] });
    if (u.role === 'admin') groups.push({ label: 'People Ops', items: [['a-overview', 'Dashboard'], ['a-approvals', 'All approvals', allPending], ['a-employees', 'Employees & access'], ['a-org', 'Reporting line'], ['a-calendar', 'Leave calendar'], ['a-policy', 'Leave policy'], ['a-holidays', 'Public holidays']] });
    groups.push({ label: 'Settings', items: [['account', 'Account']] });
    return groups;
  }

  function shellView(u) {
    const groups = navFor(u);
    const keys = groups.flatMap(g => g.items.map(i => i[0]));
    if (!ui.view || !keys.includes(ui.view)) ui.view = u.role === 'admin' ? 'a-overview' : isLeader(u) ? 't-approvals' : 'overview';
    const v = VIEWS[ui.view](u);
    return '<div class="shell">' +
      '<aside class="side">' +
        '<div class="side-brand"><div class="logo">' + LOGO_SVG + 'swing</div><small>HRIS · ' + ROLE_LABEL[u.role] + '</small></div>' +
        '<nav class="nav" aria-label="Main">' + groups.map(g => '<div class="nav-group"><div class="nav-label">' + g.label + '</div>' + g.items.map(([k, label, count]) =>
          '<button class="' + (ui.view === k ? 'on' : '') + '" data-nav="' + k + '"><span>' + label + '</span>' + (count ? '<span class="count num">' + count + '</span>' : '') + '</button>').join('') + '</div>').join('') + '</nav>' +
        '<div class="side-foot">' +
          '<div class="me">' + avatar(u) + '<div><b>' + esc(u.name) + '</b><span class="faint mono" style="font-size:12px">' + esc(u.id) + '</span></div></div>' +
          '<div><button class="btn sm" data-action="logout">Sign out</button></div>' +
        '</div>' +
      '</aside>' +
      '<main class="main">' +
        '<header class="page-head"><div><div class="eyebrow">' + v.eyebrow + '</div><h1>' + v.title + '</h1>' + (v.sub ? '<p>' + v.sub + '</p>' : '') + '</div>' + (v.actions ? '<div class="row">' + v.actions + '</div>' : '') + '</header>' +
        v.body +
      '</main>' +
    '</div>';
  }

  const VIEWS = {};

  // ---------- my leave ----------
  function paidTiles(u) {
    const L = paidLedger(u);
    if (!L.hasJoin) {
      return '<div class="card tile"><span class="label">Paid leave available</span><div class="big">-</div><div class="of">Your join date is not set yet, so no paid leave has been earned. Ask People Ops to add it.</div></div>';
    }
    const total = Math.ceil(L.available + L.used + L.pending);
    let dots = '';
    for (let i = 0; i < Math.min(total, 36); i++) dots += '<i class="' + (i < L.used ? 'used' : i < L.used + L.pending ? 'pend' : 'avail') + '"></i>';
    const y = thisYear(), cap = state.policy.carryCap;
    return '<div class="card tile"><span class="label">Paid leave available</span><div class="big num accent">' + fmtNum(L.available) + '</div><div class="of">days you can book now</div><div class="dots" aria-hidden="true">' + dots + '</div><div class="meta num"><span>' + fmtNum(L.used) + ' used this year</span><span>' + fmtNum(L.pending) + ' pending</span></div></div>' +
      '<div class="card tile"><span class="label">Earned in ' + y + '</span><div class="big num">' + fmtNum(L.earnedThisYear) + '</div><div class="of">+' + fmtNum(state.policy.perMonth) + ' on ' + fmt(L.next) + '</div><div class="meta num"><span>' + (L.carried ? fmtNum(L.carried) + ' carried in from ' + (y - 1) + ', ' + fmtNum(L.carriedLeft) + ' left' : 'Nothing carried in from ' + (y - 1)) + '</span></div></div>' +
      '<div class="card tile"><span class="label">Carries into ' + (y + 1) + '</span><div class="big num">' + fmtNum(L.carryToNext) + '</div><div class="of">' + (L.lostAtYearEnd ? fmtDays(L.lostAtYearEnd) + ' will be lost on 31 Dec if not used.' : 'Nothing is lost on 31 Dec.') + '</div><div class="meta"><span>Up to ' + fmtDays(cap) + ' carry over</span></div></div>';
  }

  function holidayList(country, from, limit) {
    const list = holidaysOf(country).filter(h => h.date >= from).sort((a, b) => a.date.localeCompare(b.date)).slice(0, limit);

  VIEWS.overview = u => {
    const t = todayISO();

      eyebrow: 'Attendance · ' + thisYear(),
      title: 'Hi ' + esc(u.name.split(' ')[0]) + ', here is your time off',
      sub: subline(u) + (u.joinDate ? ' · Joined ' + fmt(u.joinDate) : '') + ' · ' + (m ? 'Reports to ' + esc(m.name) : 'No leader set, People Ops approves'),
      actions: '<button class="btn primary" data-nav="request">Request leave</button>',
      body: (isLeader(u) && teamWaiting ? '<div class="card dark row" style="justify-content:space-between"><div><span class="label">My team</span><h3 style="margin-top:6px">' + teamWaiting + ' leave ' + (teamWaiting === 1 ? 'request is' : 'requests are') + ' waiting for you</h3></div><button class="btn" data-nav="t-approvals">Review now</button></div>' : '') +

        '</section>' +
        '<section class="grid-2">' +
          '<div class="card"><div class="card-head"><h3>Your upcoming time off</h3><button class="btn ghost sm" data-nav="mine">All requests</button></div>' +
            (upcoming.length ? '<div class="list">' + upcoming.map(r => '<div class="list-item"><div class="date-chip"><b class="num">' + fromISO(r.start).getDate() + '</b><small>' + fmt(r.start, { month: 'short' }) + '</small></div><div class="grow"><b>' + typeLabel(r) + '</b><div class="faint">' + fmtRange(r.start, r.end) + ' · ' + fmtDays(r.days) + '</div></div>' + statusPill(r.status) + '</div>').join('') + '</div>' : '<p class="empty">Nothing booked yet.</p>') +

        '</section>' +

    };

  VIEWS.request = u => {

      sub: 'Pick your dates. Days count working days only. Weekends and ' + COUNTRIES[u.country] + ' public holidays are skipped.',
      body: '<div class="split">' +
        '<form id="request-form" class="card stack" novalidate>' +
          '<div class="field"><span>Leave type</span><div class="seg" id="rq-type" role="radiogroup">' + LEAVE_TYPES.map(t => '<button type="button" role="radio" aria-checked="' + (d.type === t.code) + '" data-type="' + t.code + '" class="' + (d.type === t.code ? 'on' : '') + '">' + t.name + (t.code === 'PL' ? ' (' + (L.hasJoin ? fmtNum(L.available) : '0') + ')' : '') + '</button>').join('') + '</div><small id="rq-type-hint"></small></div>' +
          '<div class="form-grid">' +
            '<label class="field"><span>First day</span><input class="input" type="date" id="rq-start" value="' + d.start + '"></label>' +

          '</div><small>Half days are for single-day requests.</small></div>' +
          '<label class="field" id="rq-specify-wrap"><span>Specify the leave</span><input class="input" id="rq-specify" placeholder="e.g. Wedding of a sibling, moving house, religious holiday" value="' + esc(d.specify) + '"></label>' +
          '<label class="field" id="rq-doc-wrap"><span>Surat sakit (doctor\'s note)</span><input class="input" type="file" id="rq-doc" accept=".pdf,.jpg,.jpeg,.png"><small id="rq-doc-hint">PDF, JPG or PNG.' + (d.attachment ? ' Attached: ' + esc(d.attachment) : '') + '</small></label>' +
          '<label class="field"><span>Note for your leader <span class="faint" style="font-weight:400">(optional)</span></span><textarea class="input" id="rq-reason" placeholder="Anything they should know">' + esc(d.reason) + '</textarea></label>' +

        '</form>' +
        '<aside class="card dark summary" id="rq-summary"></aside>' +
      '</div>'
    };

  function summaryHTML(u) {
    const d = ui.draft, t = leaveType(d.type);
    const c = countDays(d.start, d.end, u.country, d.half);
    const rows = ['<dt>Dates</dt><dd>' + (d.start && d.end && d.end >= d.start ? fmtRange(d.start, d.end) : '-') + '</dd>'];
    if (d.type === 'PL') {
      const L = paidLedger(u);
      const at = d.start ? L.validAt(d.start) : 0;
      rows.push('<dt>Available on ' + (d.start ? fmt(d.start, { day: 'numeric', month: 'short' }) : 'that date') + '</dt><dd>' + (L.hasJoin ? fmtDays(at) : 'Join date not set') + '</dd>');
      if (L.hasJoin) rows.push('<dt>Left after this</dt><dd>' + fmtDays(Math.max(0, at - c.days)) + '</dd>');
    } else if (d.type === 'SL') {
      rows.push('<dt>Surat sakit</dt><dd>' + (d.attachment ? 'Attached' : 'Required') + '</dd>');
    } else {
      rows.push('<dt>Leave for</dt><dd>' + (esc(d.specify) || 'Not specified yet') + '</dd>');
    }
    rows.push('<dt>Approver</dt><dd>' + approverLabel(u) + '</dd>');
    return '<span class="label">Request summary</span>' +
      '<div class="days num">' + fmtNum(c.days) + '</div><div class="muted">working ' + (c.days === 1 ? 'day' : 'days') + ' of ' + t.name.toLowerCase() + '</div>' +
      '<dl class="num">' + rows.join('') + '</dl>' +
      (c.skipped.length ? '<div class="skipped"><span class="label">Public holidays skipped</span>' + c.skipped.map(s => '<span><b>' + fmtShort(s.date) + '</b>' + esc(s.name) + '</span>').join('') + '</div>' : '');
  }

  function validateDraft(u) {
    const d = ui.draft;
    if (!d.start || !d.end) return 'Pick a first and last day.';
    if (d.end < d.start) return 'The last day is before the first day. Swap the dates.';
    const c = countDays(d.start, d.end, u.country, d.half);
    if (c.days === 0) return 'Those dates are all weekends or public holidays, so there is nothing to request.';
    if (d.type === 'PL') {
      if (!u.joinDate) return 'Your join date is not set yet, so you have no paid leave. Ask People Ops to add it, or pick Other leave.';
      const L = paidLedger(u, { start: d.start, days: c.days });
      const before = paidLedger(u);
      if (L.short > 0) return 'You have ' + fmtDays(before.validAt(d.start)) + ' of paid leave available for ' + fmt(d.start) + ' and this request needs ' + fmtDays(c.days) + '. Shorten it, or pick Other leave for the rest.';
      if (L.shortTotal > before.shortTotal) return 'This would leave your paid leave booked for next year without enough days, because fewer days would carry over. Shorten this request or move the other one.';
    }
    if (d.type === 'SL' && !d.attachment) return 'Sick leave needs a surat sakit (doctor\'s note). Attach it to continue.';
    if (d.type === 'OL' && d.specify.trim().length < 3) return 'Specify what the leave is for, so your leader can review it.';
    const clash = state.requests.find(r => r.empId === u.id && (r.status === 'pending' || r.status === 'approved') && r.start <= d.end && r.end >= d.start);
    if (clash) return 'These dates overlap your ' + clash.status + ' request ' + clash.id + ' (' + fmtRange(clash.start, clash.end) + '). Cancel it first or pick other dates.';
    return null;
  }

  const decidedByName = r => r.decidedBy && emp(r.decidedBy) ? esc(emp(r.decidedBy).name) : '-';

  VIEWS.mine = u => {
    const all = state.requests.filter(r => r.empId === u.id).sort((a, b) => b.start.localeCompare(a.start));
    const rows = ui.reqFilter === 'all' ? all : all.filter(r => r.status === ui.reqFilter);
    const filters = ['all', 'pending', 'approved', 'rejected', 'cancelled'];
    return {
      eyebrow: 'Attendance · History',
      title: 'My requests',
      actions: '<button class="btn primary" data-nav="request">Request leave</button>',
      body: '<div class="card"><div class="card-head"><div class="seg">' + filters.map(f => '<button data-filter="' + f + '" class="' + (ui.reqFilter === f ? 'on' : '') + '">' + f[0].toUpperCase() + f.slice(1) + (f === 'all' ? '' : ' (' + all.filter(r => r.status === f).length + ')') + '</button>').join('') + '</div></div>' +
        (rows.length ? '<div class="table-wrap"><table><thead><tr><th>Ref</th><th>Type</th><th>Dates</th><th>Days</th><th>Status</th><th>Decided by</th><th>Note</th><th></th></tr></thead><tbody>' +
          rows.map(r => '<tr><td class="mono">' + r.id + '</td><td>' + typeLabel(r) + (r.attachment ? '<div class="faint" style="font-size:12.5px">' + esc(r.attachment) + '</div>' : '') + '</td><td class="num">' + fmtRange(r.start, r.end) + (r.half !== 'none' ? '<div class="faint">' + (r.half === 'am' ? 'Morning' : 'Afternoon') + '</div>' : '') + '</td><td class="num">' + fmtNum(r.days) + '</td><td>' + statusPill(r.status) + '</td><td>' + (r.status === 'pending' ? '<span class="faint">' + approverLabel(u) + '</span>' : r.status === 'cancelled' ? '<span class="faint">You</span>' : decidedByName(r)) + '</td><td class="muted">' + (esc(r.note) || '<span class="faint">-</span>') + '</td><td class="actions">' +
            (r.status === 'pending' || (r.status === 'approved' && r.start > todayISO())
              ? (ui.confirmCancel === r.id ? '<span class="row" style="justify-content:flex-end;gap:6px"><span class="muted" style="font-size:13px">Cancel this request?</span><button class="btn danger sm" data-action="cancel-yes" data-id="' + r.id + '">Yes, cancel</button><button class="btn sm" data-action="cancel-no">Keep</button></span>' : '<button class="btn ghost sm" data-action="cancel-ask" data-id="' + r.id + '">Cancel</button>')
              : '') + '</td></tr>').join('') +
        '</tbody></table></div>' : '<p class="empty">No ' + (ui.reqFilter === 'all' ? '' : ui.reqFilter + ' ') + 'requests.</p>') +
      '</div>'
    };
  };

  function holidayYearView(country, editable) {
    const t = todayISO();
    const months = {};
    holidaysOf(country).slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(h => { const k = h.date.slice(0, 7); (months[k] = months[k] || []).push(h); });
    const keys = Object.keys(months);
    if (!keys.length) return '<p class="empty">No public holidays added yet.</p>';
    return '<div class="grid-2">' + keys.map(k => '<div class="card"><div class="card-head"><h3>' + fmt(k + '-01', { month: 'long', year: 'numeric' }) + '</h3><span class="faint num">' + months[k].length + '</span></div><div class="list">' +
      months[k].map(h => '<div class="list-item" style="' + (h.date < t ? 'opacity:.5' : '') + '"><div class="date-chip"><b class="num">' + fromISO(h.date).getDate() + '</b><small>' + fmt(h.date, { weekday: 'short' }) + '</small></div><div class="grow"><b>' + esc(h.name) + '</b>' + (h.date < t ? '<div class="faint">Passed</div>' : isWeekend(h.date) ? '<div class="faint">Weekend</div>' : '') + '</div>' +
        (editable ? '<button class="btn ghost sm" data-action="hol-remove" data-date="' + h.date + '" data-name="' + esc(h.name) + '">Remove</button>' : '') + '</div>').join('') +
    '</div></div>').join('') + '</div>';

  VIEWS.holidays = u => ({

    title: 'Public holidays ' + thisYear(),

  VIEWS.account = u => {

    return {

      body: '<div class="grid-2">' +

          '<div class="table-wrap"><table><tbody>' + rows.map(([k, v]) => '<tr><td class="muted" style="width:40%">' + k + '</td><td>' + v + '</td></tr>').join('') + '</tbody></table></div></div>' +
        '<form id="pw-form" class="card stack" novalidate><h3>Change password</h3>' +
          '<label class="field"><span>Current password</span><input class="input" type="password" id="pw-cur" autocomplete="current-password"></label>' +
          '<label class="field"><span>New password</span><input class="input" type="password" id="pw-new" autocomplete="new-password"><small>At least 8 characters.</small></label>' +
          '<label class="field"><span>Confirm new password</span><input class="input" type="password" id="pw-confirm" autocomplete="new-password"></label>' +
          '<p class="error-text" id="pw-error" hidden></p>' +
          '<div><button class="btn primary" type="submit">Update password</button></div>' +

    };

  // ---------- approvals / calendar shared ----------
  function whoOff(iso, ids) {
    return state.requests.filter(r => r.status === 'approved' && isOn(r, iso) && (!ids || ids.includes(r.empId))).map(r => ({ r, e: emp(r.empId) }));
  }

  function approvalCard(r, compact, u) {
    const e = emp(r.empId), t = leaveType(r.type);
    const m = e.managerId && emp(e.managerId);
    const overriding = u.role === 'admin' && m && m.id !== u.id;
    let balance = '';
    if (r.type === 'PL') {
      const L = paidLedger(e);
      balance = '<div><small>Paid leave left after</small><span>' + (L.hasJoin ? fmtDays(L.validAt(r.start)) : 'No join date') + '</span></div>';
    }
    return '<div class="card approval">' +
      '<div><div class="who">' + avatar(e) + '<div><b style="font-family:var(--font-display)">' + esc(e.name) + '</b><div class="faint" style="font-size:13px"><span class="mono">' + esc(e.id) + '</span> · ' + subline(e) + '</div></div></div>' +
        '<div class="facts num">' +
          '<div><small>Type</small><span>' + typeLabel(r) + '</span></div>' +
          '<div><small>Dates</small><span>' + fmtRange(r.start, r.end) + (r.half !== 'none' ? ' · ' + (r.half === 'am' ? 'AM' : 'PM') : '') + '</span></div>' +
          '<div><small>Working days</small><span>' + fmtNum(r.days) + '</span></div>' + balance +

      '</div>' +
      (canApprove(u, r) ? '<div class="btns"><button class="btn ok sm" data-action="approve" data-id="' + r.id + '">Approve</button><button class="btn danger sm" data-action="reject" data-id="' + r.id + '">Reject</button></div>' : '<div></div>') +
    '</div>';

  function approvalsBody(u, scopeIds) {
    const inScope = r => r.empId !== u.id && (!scopeIds || scopeIds.includes(r.empId));
    const pending = state.requests.filter(r => r.status === 'pending' && inScope(r)).sort((a, b) => a.start.localeCompare(b.start));

      '</div>' +
      (ui.approvalsTab === 'pending'
        ? (pending.length ? '<div class="stack">' + pending.map(r => approvalCard(r, false, u)).join('') + '</div>' : '<div class="card"><p class="empty">All caught up. No requests waiting.</p></div>')
        : '<div class="card"><div class="table-wrap"><table><thead><tr><th>Ref</th><th>Employee</th><th>Type</th><th>Dates</th><th>Days</th><th>Status</th><th>Decided by</th><th>Note</th></tr></thead><tbody>' +

          '</tbody></table></div></div>');
  }

  function calendarBody(scopeIds) {
    const t = todayISO();
    if (!ui.calMonth) ui.calMonth = t.slice(0, 7);
    const first = fromISO(ui.calMonth + '-01');
    const gridStart = addDays(ui.calMonth + '-01', -((first.getDay() + 6) % 7));
    const countries = ui.calCountry === 'all' ? ['ID', 'MY'] : [ui.calCountry];
    const reqs = state.requests.filter(r => (r.status === 'approved' || r.status === 'pending') && countries.includes(emp(r.empId).country) && (!scopeIds || scopeIds.includes(r.empId)));
    let cells = '';
    for (let i = 0; i < 42; i++) {
      const d = addDays(gridStart, i);
      const out = d.slice(0, 7) !== ui.calMonth;
      const hols = countries.map(c => { const h = holidayOn(d, c); return h ? (countries.length > 1 ? c + ' · ' : '') + h.name : null; }).filter(Boolean);
      const peopleOff = reqs.filter(r => isOn(r, d));
      cells += '<div class="day' + (out ? ' out' : '') + (isWeekend(d) ? ' weekend' : '') + (d === t ? ' today' : '') + '"><span class="d num">' + fromISO(d).getDate() + '</span>' +
        hols.map(h => '<span class="hol">' + esc(h) + '</span>').join('') +
        peopleOff.map(r => { const e = emp(r.empId); return '<span class="who' + (r.status === 'pending' ? ' pend' : '') + '" title="' + esc(e.name) + ' · ' + leaveType(r.type).name + ' (' + r.status + ')">' + esc(e.name.split(' ')[0]) + ' · ' + r.type + '</span>'; }).join('') +
      '</div>';
    }
