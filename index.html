  // ---------- import ----------
  function cellISO(v) {
    if (v == null || v === '') return '';
    if (v instanceof Date) return toISO(v);
    if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 86400000)); return toISO(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);
    m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
    if (m) return m[3] + '-' + pad(+m[2]) + '-' + pad(+m[1]);
    return 'invalid';
  }

  function importRows(rows) {
    const pick = (row, ...names) => { const k = Object.keys(row).find(h => names.includes(h.trim().toLowerCase())); return k == null ? '' : row[k]; };
    const result = { created: [], updated: 0, join: 0, leaders: 0, merged: 0, warnings: [] };
    const pendingLeaders = [];
    rows.forEach((row, i) => {
      const name = String(pick(row, 'name', 'nama karyawan', 'nama') || '').replace(/\s+/g, ' ').trim();
      if (!name || /^total$/i.test(name)) return;
      if (/\(gsa\)/i.test(name)) { result.merged++; return; }
      const statusRaw = String(pick(row, 'ft / pt', 'ft/pt', 'status', 'employment status') || '').trim();
      const title = String(pick(row, 'jabatan', 'title', 'job title') || '').trim();
      const status = /^pt$|part/i.test(statusRaw || title) ? 'PT' : 'FT';
      const accessRaw = String(pick(row, 'access') || '').trim().toLowerCase();
      let username = String(pick(row, 'username') || '').trim().toLowerCase();
      let e = (username && emp(username)) || state.employees.find(x => !x.system && x.name.toLowerCase() === name.toLowerCase());
      if (!e) {
        username = username || makeUsername(name);
        if (!username || emp(username)) { result.warnings.push('Row ' + (i + 2) + ': could not make a unique username for ' + name + '.'); return; }
        const pw = String(pick(row, 'temporary password', 'password') || '').trim() || generatePassword();
        e = { id: username, name, status, title, country: 'ID', joinDate: '', managerId: null, role: 'reportee', password: pw, mustChange: true, active: true };
        state.employees.push(e);
        result.created.push(e.id);
      } else {
        result.updated++;
        e.name = name;
        if (statusRaw) e.status = status;
        if (title) e.title = title;
      }
      if (accessRaw) e.role = accessRaw.startsWith('hr') || accessRaw === 'admin' ? 'admin' : accessRaw.startsWith('leader') ? 'leader' : 'reportee';
      const join = cellISO(pick(row, 'join date', 'joined', 'join_date'));
      if (join === 'invalid') result.warnings.push(name + ': join date "' + pick(row, 'join date') + '" is not a date. Use YYYY-MM-DD.');
      else if (join) { e.joinDate = join; result.join++; }
      const leaderName = String(pick(row, 'direct report to', 'reports to', 'leader') || '').trim();
      if (leaderName) pendingLeaders.push([e, leaderName]);
    });
    pendingLeaders.forEach(([e, leaderName]) => {
      const key = leaderName.toLowerCase();
      const candidates = state.employees.filter(x => !x.system && x.id !== e.id && (x.name.toLowerCase() === key || x.name.toLowerCase().startsWith(key + ' ')));
      const leader = candidates[0];
      if (!leader) { result.warnings.push(e.name + ': leader "' + leaderName + '" is not in the list.'); return; }
      if (isBelow(leader.id, e.id)) { result.warnings.push(e.name + ': ' + leader.name + ' already reports to them, so this would make a loop. Skipped.'); return; }
      if (leader.role === 'reportee') leader.role = 'leader';
      e.managerId = leader.id; result.leaders++;
    });
    return result;
  }

  function handleImport(file) {
    if (typeof XLSX === 'undefined') { toast('The spreadsheet reader did not load. Check your internet connection and try again.'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const wb = XLSX.read(new Uint8Array(reader.result), { type: 'array', cellDates: true });
        const sheetName = wb.SheetNames.find(n => /master|jatah/i.test(n)) || wb.SheetNames[0];
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '', raw: true });
        if (!rows.length || !Object.keys(rows[0]).some(h => ['name', 'nama', 'nama karyawan'].includes(h.trim().toLowerCase()))) { toast('No "Name" column found on sheet ' + sheetName + '. Use the master data file.'); return; }
        const res = importRows(rows);
        save();
        openModal({ kind: 'import-result', res, file: file.name });
      } catch (err) {
        toast('Could not read ' + file.name + '. Save it as .xlsx and try again.');
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // ---------- modals ----------
  function modalView(m) {
    if (m.kind === 'add-emp' || m.kind === 'edit-emp') {
      const editing = m.kind === 'edit-emp';
      const e = editing ? emp(m.id) : { name: '', status: 'FT', joinDate: '', role: 'reportee', managerId: '' };
      const sel = (v, cur) => v === cur ? ' selected' : '';
      return '<div><div class="eyebrow">' + (editing ? 'Edit · ' + esc(e.id) : 'New account') + '</div><h2 style="margin-top:8px">' + (editing ? esc(e.name) : 'Create an account') + '</h2><p class="muted" style="margin-top:6px">' + (editing ? 'The username stays the same.' : 'We generate the username and a temporary password.') + '</p></div>' +
        '<form id="emp-form" class="stack" novalidate data-edit="' + (editing ? esc(e.id) : '') + '"><div class="form-grid">' +
          '<label class="field full"><span>Full name</span><input class="input" id="ne-name" placeholder="e.g. Putri Anggraini" value="' + esc(e.name) + '"></label>' +
          '<label class="field"><span>FT / PT</span><select class="input" id="ne-status">' + ['FT', 'PT'].map(s => '<option value="' + s + '"' + sel(s, e.status) + '>' + STATUS_LABEL[s] + '</option>').join('') + '</select></label>' +
          '<label class="field"><span>Join date</span><input class="input" type="date" id="ne-join" value="' + e.joinDate + '"><small>Paid leave builds up from this date.</small></label>' +
          '<label class="field"><span>Access</span><select class="input" id="ne-role">' + ['reportee', 'leader', 'admin'].map(r => '<option value="' + r + '"' + sel(r, e.role) + '>' + ROLE_LABEL[r] + '</option>').join('') + '</select></label>' +
          '<label class="field full"><span>Direct report to</span><select class="input" id="ne-manager">' + leaderOptions(editing ? e.id : null, e.managerId) + '</select><small>This leader approves their leave. People Ops can always approve too.</small></label>' +
        '</div><p class="faint" id="ne-preview" style="font-size:13.5px"></p><p class="error-text" id="ne-error" hidden></p>' +
        '<div class="modal-actions"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">' + (editing ? 'Save changes' : 'Create account') + '</button></div></form>';
    }
    if (m.kind === 'creds') {
      const e = emp(m.id);
      const text = 'Swing HRIS - Attendance\nUsername: ' + e.id + '\nTemporary password: ' + m.password + '\nYou will set your own password on first sign-in.';
      return '<div><div class="eyebrow">' + (m.reset ? 'Password reset' : 'Account created') + '</div><h2 style="margin-top:8px">Share these with ' + esc(e.name.split(' ')[0]) + '</h2><p class="muted" style="margin-top:6px">' + esc(e.name) + ' will be asked to set a new password at first sign-in.</p></div>' +
        '<div class="cred">' +
          '<div class="cred-row"><div><small>Username</small><span class="mono">' + esc(e.id) + '</span></div><button class="btn sm" data-action="copy" data-text="' + esc(e.id) + '">Copy</button></div>' +
          '<div class="cred-row"><div><small>Temporary password</small><span class="mono">' + esc(m.password) + '</span></div><button class="btn sm" data-action="copy" data-text="' + esc(m.password) + '">Copy</button></div>' +
        '</div>' +
        '<div class="modal-actions"><button class="btn" data-action="copy" data-text="' + esc(text) + '">Copy both</button><button class="btn primary" data-action="close-modal">Done</button></div>';
    }
    if (m.kind === 'import-result') {
      const r = m.res;
      return '<div><div class="eyebrow">Import</div><h2 style="margin-top:8px">Imported ' + esc(m.file) + '</h2></div>' +
        '<div class="grid-2" style="gap:10px">' +
          [['New accounts', r.created.length], ['Updated', r.updated], ['Join dates set', r.join], ['Leaders set', r.leaders]].map(([k, v]) => '<div class="card" style="padding:14px;box-shadow:none"><div style="font-family:var(--font-display);font-weight:800;font-size:28px" class="num">' + v + '</div><div class="muted" style="font-size:13px">' + k + '</div></div>').join('') +
        '</div>' +
        (r.merged ? '<p class="muted" style="font-size:14px">Skipped ' + r.merged + ' (GSA) ' + (r.merged === 1 ? 'row' : 'rows') + '. Those people already have one account from their main row.</p>' : '') +
        (r.created.length ? '<p class="muted" style="font-size:14px">New accounts use the temporary password from the file, or a generated one if the file had none. Everyone must set a new password at first sign-in.</p>' : '') +
        (r.warnings.length ? '<div class="note warn"><div><b>' + r.warnings.length + ' ' + (r.warnings.length === 1 ? 'row needs' : 'rows need') + ' a look</b><ul style="margin:6px 0 0;padding-left:18px">' + r.warnings.slice(0, 12).map(w => '<li>' + esc(w) + '</li>').join('') + '</ul>' + (r.warnings.length > 12 ? '<div>and ' + (r.warnings.length - 12) + ' more</div>' : '') + '</div></div>' : '') +
        '<div class="modal-actions"><button class="btn primary" data-action="close-modal">Done</button></div>';
    }
    if (m.kind === 'confirm-reset') {
      const e = emp(m.id);
      return '<div><div class="eyebrow">Reset password</div><h2 style="margin-top:8px">Reset password for ' + esc(e.name) + '?</h2><p class="muted" style="margin-top:6px">Their current password stops working right away. You get a new temporary password to share.</p></div>' +
        '<div class="modal-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="reset-pw-yes" data-id="' + esc(e.id) + '">Reset password</button></div>';
    }
    if (m.kind === 'confirm-deactivate') {
      const e = emp(m.id);
      const reports = directReports(e.id).filter(x => x.active).length;
      return '<div><div class="eyebrow">Deactivate</div><h2 style="margin-top:8px">Deactivate ' + esc(e.name) + '?</h2><p class="muted" style="margin-top:6px">They can no longer sign in. Their leave history stays. You can reactivate the account any time.</p></div>' +
        (reports ? '<div class="note warn"><div><b>' + reports + ' people report to ' + esc(e.name.split(' ')[0]) + '.</b> Their leave goes to People Ops until you give them a new leader.</div></div>' : '') +
        '<div class="modal-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn danger" data-action="deactivate-yes" data-id="' + esc(e.id) + '">Deactivate</button></div>';
    }
    if (m.kind === 'reject') {
      const r = state.requests.find(x => x.id === m.id), e = emp(r.empId);
      return '<div><div class="eyebrow">Reject request</div><h2 style="margin-top:8px">Reject ' + esc(e.name.split(' ')[0]) + '\'s ' + leaveType(r.type).name.toLowerCase() + '?</h2><p class="muted" style="margin-top:6px">' + fmtRange(r.start, r.end) + ' · ' + fmtDays(r.days) + '</p></div>' +
        '<form id="reject-form" class="stack" novalidate><label class="field"><span>Reason for the employee</span><textarea class="input" id="rj-note" placeholder="e.g. Overlaps month-end closing. Please move it by one week."></textarea></label><p class="error-text" id="rj-error" hidden></p>' +
        '<div class="modal-actions"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn danger" type="submit">Reject request</button></div></form>';
    }
    return '';
  }

  // ---------- wiring ----------
  function showError(id, msg) { const el = document.getElementById(id); if (!el) return; el.textContent = msg || ''; el.hidden = !msg; }

  function afterRender() {
    const u = me();
    const lf = document.getElementById('login-form');
    if (lf) lf.addEventListener('submit', ev => {
      ev.preventDefault();
      const id = document.getElementById('login-id').value.trim().toLowerCase();
      const pw = document.getElementById('login-pw').value;
      const e = emp(id);
      if (!id || !pw) return showError('login-error', 'Enter your username and password.');
      if (!e || e.password !== pw) return showError('login-error', 'Username or password is incorrect. Check with People Ops if you lost them.');
      if (!e.active) return showError('login-error', 'This account is deactivated. Ask People Ops to reactivate it.');
      state.sessionUserId = e.id; ui.view = null; ui.draft = null; save(); render();
    });

    const ff = document.getElementById('force-form');
    if (ff) ff.addEventListener('submit', ev => {
      ev.preventDefault();
      const a = document.getElementById('fc-new').value, b = document.getElementById('fc-confirm').value;
      if (a.length < 8) return showError('fc-error', 'Use at least 8 characters.');
      if (a === u.password) return showError('fc-error', 'Choose a password different from the temporary one.');
      if (a !== b) return showError('fc-error', 'The two passwords do not match.');
      u.password = a; u.mustChange = false; save(); render(); toast('Password saved. Welcome to Swing HRIS.');
    });

    const pf = document.getElementById('pw-form');
    if (pf) pf.addEventListener('submit', ev => {
      ev.preventDefault();
      const cur = document.getElementById('pw-cur').value, a = document.getElementById('pw-new').value, b = document.getElementById('pw-confirm').value;
      if (cur !== u.password) return showError('pw-error', 'Current password is incorrect.');
      if (a.length < 8) return showError('pw-error', 'Use at least 8 characters.');
      if (a !== b) return showError('pw-error', 'The two new passwords do not match.');
      u.password = a; save(); render(); toast('Password updated');
    });

    const rf = document.getElementById('request-form');
    if (rf) {
      const sync = () => {
        const d = ui.draft, t = leaveType(d.type);
        const single = d.start && d.start === d.end;
        if (!single && d.half !== 'none') d.half = 'none';
        document.querySelectorAll('#rq-type button').forEach(b => { const on = b.dataset.type === d.type; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
        document.querySelectorAll('#rq-half button').forEach(b => { b.classList.toggle('on', b.dataset.half === d.half); b.disabled = !single && b.dataset.half !== 'none'; });
        document.getElementById('rq-type-hint').textContent = t.hint;
        document.getElementById('rq-specify-wrap').hidden = d.type !== 'OL';
        document.getElementById('rq-doc-wrap').hidden = d.type !== 'SL';
        document.getElementById('rq-summary').innerHTML = summaryHTML(u);
        showError('rq-error', '');
      };
      document.getElementById('rq-type').addEventListener('click', e => { const b = e.target.closest('button[data-type]'); if (!b) return; ui.draft.type = b.dataset.type; sync(); });
      document.getElementById('rq-start').addEventListener('change', e => { ui.draft.start = e.target.value; if (!ui.draft.end || ui.draft.end < ui.draft.start) { ui.draft.end = ui.draft.start; document.getElementById('rq-end').value = ui.draft.end; } sync(); });
      document.getElementById('rq-end').addEventListener('change', e => { ui.draft.end = e.target.value; sync(); });
      document.getElementById('rq-reason').addEventListener('input', e => { ui.draft.reason = e.target.value; });
      document.getElementById('rq-specify').addEventListener('input', e => { ui.draft.specify = e.target.value; document.getElementById('rq-summary').innerHTML = summaryHTML(u); });
      document.getElementById('rq-doc').addEventListener('change', e => { const f = e.target.files[0]; ui.draft.attachment = f ? f.name : ''; document.getElementById('rq-doc-hint').textContent = f ? 'Attached: ' + f.name : 'PDF, JPG or PNG.'; sync(); });
      document.getElementById('rq-half').addEventListener('click', e => { const b = e.target.closest('button[data-half]'); if (!b || b.disabled) return; ui.draft.half = b.dataset.half; sync(); });
      rf.addEventListener('submit', ev => {
        ev.preventDefault();
        const err = validateDraft(u);
        if (err) return showError('rq-error', err);
        const d = ui.draft;
        state.seq.req++;
        const id = 'LV-' + String(state.seq.req).padStart(4, '0');
        state.requests.push({ id, empId: u.id, type: d.type, start: d.start, end: d.end, half: d.half, days: countDays(d.start, d.end, u.country, d.half).days, reason: d.reason.trim(), specify: d.type === 'OL' ? d.specify.trim() : '', attachment: d.type === 'SL' ? d.attachment : '', status: 'pending', createdAt: todayISO(), decidedBy: null, decidedAt: null, note: '' });
        save(); ui.draft = null; ui.view = 'mine'; ui.reqFilter = 'all'; render(); toast('Request ' + id + ' sent to ' + approverLabel(u).replace(' or People Ops', ''));
      });
      sync();
    }

    const q = document.getElementById('emp-q');
    if (q) q.addEventListener('input', e => {
      ui.empQuery = e.target.value; const pos = e.target.selectionStart; render();
      const n = document.getElementById('emp-q'); n.focus(); n.setSelectionRange(pos, pos);
    });

    const imp = document.getElementById('import-file');
    if (imp) imp.addEventListener('change', e => { const f = e.target.files[0]; if (f) handleImport(f); });

    const polf = document.getElementById('policy-form');
    if (polf) polf.addEventListener('submit', ev => {
      ev.preventDefault();
      const per = Number(document.getElementById('pol-per').value), cap = Number(document.getElementById('pol-cap').value);
      if (!(per >= 0 && per <= 5) || !(cap >= 0 && cap <= 30)) { toast('Days per month must be 0 to 5 and carry-over 0 to 30'); return; }
      state.policy = { perMonth: per, carryCap: cap }; save(); render(); toast('Leave policy saved');
    });

    const hf = document.getElementById('hol-form');
    if (hf) hf.addEventListener('submit', ev => {
      ev.preventDefault();
      const date = document.getElementById('hol-date').value, name = document.getElementById('hol-name').value.trim();
      if (!date || !name) return showError('hol-error', 'Add both a date and a name.');
      if (holidayOn(date, ui.holCountry)) return showError('hol-error', fmt(date) + ' is already a holiday in ' + COUNTRIES[ui.holCountry] + '.');
      state.holidays[ui.holCountry].push({ date, name });
      save(); render(); toast(name + ' added to ' + COUNTRIES[ui.holCountry]);
    });

    const ef = document.getElementById('emp-form');
    if (ef) {
      const editId = ef.dataset.edit;
      const preview = () => { if (editId) return; const n = document.getElementById('ne-name').value.trim(); const un = n ? makeUsername(n) : null; document.getElementById('ne-preview').textContent = un ? 'Username will be ' + un + '.' : ''; };
      document.getElementById('ne-name').addEventListener('input', preview);
      ef.addEventListener('submit', ev => {
        ev.preventDefault();
        const name = document.getElementById('ne-name').value.replace(/\s+/g, ' ').trim();
        const role = document.getElementById('ne-role').value, managerId = document.getElementById('ne-manager').value || null;
        if (name.length < 2) return showError('ne-error', 'Enter the employee\'s full name.');
        const fields = { name, status: document.getElementById('ne-status').value, joinDate: document.getElementById('ne-join').value, role, managerId };
        if (editId) {
          const e = emp(editId);
          const reports = directReports(editId).length;
          if (role === 'reportee' && reports) return showError('ne-error', e.name.split(' ')[0] + ' has ' + reports + ' direct reports. Move them to another leader before changing access to Reportee.');
          if (editId === u.id && role !== 'admin') return showError('ne-error', 'You cannot remove your own HR admin access.');
          Object.assign(e, fields); save(); ui.modal = null; render(); toast(e.name + ' updated');
          return;
        }
        const id = makeUsername(name);
        if (!id) return showError('ne-error', 'The name needs at least one word of two letters or more to make a username.');
        const password = generatePassword();
        state.employees.push(Object.assign({ id, country: 'ID', password, mustChange: true, active: true }, fields));
        save();
        openModal({ kind: 'creds', id, password });
      });
    }

    const rjf = document.getElementById('reject-form');
    if (rjf) rjf.addEventListener('submit', ev => {
      ev.preventDefault();
      const note = document.getElementById('rj-note').value.trim();
      if (!note) return showError('rj-error', 'Add a short reason. The employee sees it on their request.');
      const r = state.requests.find(x => x.id === ui.modal.id);
      Object.assign(r, { status: 'rejected', note, decidedBy: u.id, decidedAt: todayISO() });
      save(); ui.modal = null; render(); toast(r.id + ' rejected');
    });
  }

  app.addEventListener('click', ev => {
    const nav = ev.target.closest('[data-nav]');
    if (nav) { ui.view = nav.dataset.nav; ui.confirmCancel = null; ui.revealed = null; render(); window.scrollTo(0, 0); return; }
    const f = ev.target.closest('[data-filter]'); if (f) { ui.reqFilter = f.dataset.filter; render(); return; }
    const ef = ev.target.closest('[data-emp-filter]'); if (ef) { ui.empFilter = ef.dataset.empFilter; render(); return; }
    const tab = ev.target.closest('[data-tab]'); if (tab) { ui.approvalsTab = tab.dataset.tab; render(); return; }
    const cc = ev.target.closest('[data-cal-country]'); if (cc) { ui.calCountry = cc.dataset.calCountry; render(); return; }
    const hc = ev.target.closest('[data-hol-country]'); if (hc) { ui.holCountry = hc.dataset.holCountry; render(); return; }
    if (ev.target.classList.contains('overlay')) { closeModal(); return; }
    const a = ev.target.closest('[data-action]');
    if (!a) return;
    const id = a.dataset.id, u = me();
    switch (a.dataset.action) {
      case 'toggle-pw': { const i = document.getElementById('login-pw'); i.type = i.type === 'password' ? 'text' : 'password'; a.textContent = i.type === 'password' ? 'Show' : 'Hide'; break; }
      case 'logout': state.sessionUserId = null; ui.view = null; ui.modal = null; ui.draft = null; ui.revealed = null; save(); render(); break;
      case 'reset-demo': try { localStorage.removeItem(STORE_KEY); } catch (e) {} state = seed(); ui.view = null; ui.draft = null; render(); toast('Demo data reset'); break;
      case 'reset-draft': ui.draft = null; render(); break;
      case 'cancel-ask': ui.confirmCancel = id; render(); break;
      case 'cancel-no': ui.confirmCancel = null; render(); break;
      case 'cancel-yes': { const r = state.requests.find(x => x.id === id); r.status = 'cancelled'; ui.confirmCancel = null; save(); render(); toast(r.id + ' cancelled'); break; }
      case 'approve': { const r = state.requests.find(x => x.id === id); if (!canApprove(u, r)) { toast('Only ' + approverLabel(emp(r.empId)) + ' can approve this request'); break; } Object.assign(r, { status: 'approved', decidedBy: u.id, decidedAt: todayISO(), note: '' }); save(); render(); toast(r.id + ' approved for ' + emp(r.empId).name); break; }
      case 'reject': { const r = state.requests.find(x => x.id === id); if (canApprove(u, r)) openModal({ kind: 'reject', id }); break; }
      case 'add-emp': openModal({ kind: 'add-emp' }); break;
      case 'edit-emp': openModal({ kind: 'edit-emp', id }); break;
      case 'close-modal': closeModal(); break;
      case 'copy': copy(a.dataset.text, a); break;
      case 'reveal-pw': ui.revealed = id; render(); break;
      case 'hide-pw': ui.revealed = null; render(); break;
      case 'goto-missing': ui.view = 'a-employees'; ui.empFilter = people().some(e => e.active && !e.joinDate) ? 'nojoin' : 'noleader'; render(); break;
      case 'reset-pw': openModal({ kind: 'confirm-reset', id }); break;
      case 'reset-pw-yes': { const e = emp(id); const password = generatePassword(); e.password = password; e.mustChange = true; save(); openModal({ kind: 'creds', id, password, reset: true }); break; }
      case 'toggle-active': { const e = emp(id); if (e.active) openModal({ kind: 'confirm-deactivate', id }); else { e.active = true; save(); render(); toast(e.name + ' reactivated'); } break; }
      case 'deactivate-yes': { const e = emp(id); e.active = false; save(); ui.modal = null; render(); toast(e.name + ' deactivated'); break; }
      case 'hol-remove': { const list = state.holidays[ui.holCountry]; const i = list.findIndex(h => h.date === a.dataset.date); if (i >= 0) list.splice(i, 1); save(); render(); toast(a.dataset.name + ' removed'); break; }
      case 'cal-prev': case 'cal-next': { const d = fromISO(ui.calMonth + '-01'); d.setMonth(d.getMonth() + (a.dataset.action === 'cal-next' ? 1 : -1)); ui.calMonth = toISO(d).slice(0, 7); render(); break; }
      case 'cal-today': ui.calMonth = todayISO().slice(0, 7); render(); break;
    }
  });

  app.addEventListener('change', ev => {
    const join = ev.target.closest('input[data-join]');
    if (join) {
      const e = emp(join.dataset.join);
      e.joinDate = join.value; save(); render();
      toast(join.value ? e.name + ' joined ' + fmt(join.value) : 'Join date cleared for ' + e.name);
      return;
    }
    const sel = ev.target.closest('select[data-org]');
    if (!sel) return;
    const e = emp(sel.dataset.org), managerId = sel.value || null;
    if (managerId && (managerId === e.id || isBelow(managerId, e.id))) { toast('That would put ' + e.name + ' under their own team. Pick someone else.'); render(); return; }
    e.managerId = managerId; save(); render();
    toast(managerId ? e.name + ' now reports to ' + emp(managerId).name : e.name + ' has no leader now');
  });

  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && ui.modal) closeModal(); });

  state = load();
  render();
})();
</script>
</body>
</html>
